name: Update and publish site

on:
  schedule:
    # Twice a day (UTC): about 5:30am and 1:30pm in Melbourne during daylight saving.
    - cron: '30 18 * * *'
    - cron: '30 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  refresh:
    # Pull the newest podcast episodes and articles (scheduled and manual runs only).
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch newest episodes and articles
        run: node scripts/fetch-feeds.mjs
      - name: Commit feed.json if it changed
        run: |
          if git diff --quiet -- site/data/feed.json; then
            echo "Feed unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/feed.json
          git commit -m "Refresh external feeds"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

  deploy:
    # Publish site/ to GitHub Pages after every push to main and every feed refresh.
    # (Commits made by this workflow's own token do not start new runs, so the refresh deploys here.)
    needs: refresh
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
