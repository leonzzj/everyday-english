<header class="top">
  <div class="wrap">
    <div class="top-row">
      <span class="brand">韩日行程</span>
      <span class="status" id="status"></span>
      <button class="today-btn" id="todayBtn" type="button" hidden>回到今天</button>
    </div>
    <nav class="strip" id="strip" aria-label="选择日期"></nav>
  </div>
</header>

<main>
  <div class="wrap">
    <section class="view" id="v-day" aria-label="每天"></section>
    <section class="view" id="v-ov" aria-label="总览" hidden></section>
    <section class="view" id="v-notes" aria-label="须知" hidden></section>
    <section class="view" id="v-shop" aria-label="购物" hidden></section>
  </div>
</main>

<nav class="tabbar" aria-label="分区">
  <div class="wrap" role="tablist">
    <button class="tab" id="tab-day" role="tab" type="button" data-tab="day" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/><circle cx="12" cy="14.6" r="1.7" fill="currentColor" stroke="none"/></svg>每天</button>
    <button class="tab" id="tab-ov" role="tab" type="button" data-tab="ov" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 5v14"/><circle cx="6" cy="5" r="2"/><circle cx="6" cy="12" r="2"/><circle cx="6" cy="19" r="2"/><path d="M11 5h9M11 12h9M11 19h9"/></svg>总览</button>
    <button class="tab" id="tab-notes" role="tab" type="button" data-tab="notes" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5"/><circle cx="12" cy="7.8" r="1.1" fill="currentColor" stroke="none"/></svg>须知</button>
    <button class="tab" id="tab-shop" role="tab" type="button" data-tab="shop" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8L5 8z"/><path d="M9 10V7a3 3 0 0 1 6 0v3"/></svg>购物</button>
  </div>
</nav>

<div class="toast" id="toast" role="status" hidden></div>
