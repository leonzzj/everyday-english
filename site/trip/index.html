<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: a pocket timetable. One day per screen, drawn as a metro line:
   each stop is a station, the line takes the country's colour, times run down the left like a departures board. */
:root {
  --bg: #eef1f3;
  --card: #ffffff;
  --ink: #1a2026;
  --ink-2: #39434d;
  --muted: #69747f;
  --line: #dce1e6;
  --soft: #f4f6f7;
  --link: #1f5fa8;
  --sel-bg: #1a2026;
  --sel-fg: #ffffff;

  --cn: #9a6a12;  --cn-bg: #f8f0e0;
  --kr: #2a5ba6;  --kr-bg: #e8effa;
  --jp: #c0392b;  --jp-bg: #fbeceb;
  --au: #56606b;  --au-bg: #eceff2;

  --fix: #b42318;   --fix-bg: #fdeceb;   --fix-line: #f1b5ad;
  --tight: #9a5a00; --tight-bg: #fff4de; --tight-line: #f0c27a;
  --meal: #9a5a00;  --meal-bg: #fff8ec;
  --ok: #1e7a46;    --ok-bg: #e2f3e8;
  --todo: #9a5a00;  --todo-bg: #fff0d6;

  --m-fly: #2a4a9c;   --m-fly-bg: #e6ecfa;
  --m-rail: #1e7a46;  --m-rail-bg: #e2f3e8;
  --m-metro: #1f5fa8; --m-metro-bg: #e6f0fb;
  --m-bus: #9a5a00;   --m-bus-bg: #fff0d6;
  --m-taxi: #b42318;  --m-taxi-bg: #fde8e6;
  --m-walk: #4b5563;  --m-walk-bg: #eceff2;
  --m-bike: #6b2fa3;  --m-bike-bg: #f1e8fb;

  --f-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", "Apple SD Gothic Neo", sans-serif;
  --f-data: "Barlow Semi Condensed", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;

  --fs-xs: 0.75rem;
  --fs-s: 0.84rem;
  --fs-m: 0.95rem;
  --fs-l: 1.12rem;
  --fs-xl: 1.5rem;
  --fs-date: 2.25rem;

  --board-bg: #161b20; --board-fg: #f2f4f6; --board-muted: #9ba6b1; --board-line: #2c343c; --board-chip: #20272e; --board-dot: #ff7a66;
  --b-cn: #e2b35a; --b-kr: #82a9ea; --b-jp: #ff8f80; --b-au: #aab3bc;

  --gut-l: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
  --tabbar-h: 56px;
  --scrim: rgba(16, 20, 24, 0.38);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1215; --card: #171b20; --ink: #e8ebee; --ink-2: #c3cad2; --muted: #98a3ae; --line: #2a3138; --soft: #1d2228;
    --link: #8db6ef; --sel-bg: #e8ebee; --sel-fg: #0f1215;
    --cn: #e2b35a; --cn-bg: #2d2412; --kr: #82a9ea; --kr-bg: #172338; --jp: #ff8f80; --jp-bg: #3a1916; --au: #aab3bc; --au-bg: #232930;
    --fix: #ff8578; --fix-bg: #3a1714; --fix-line: #7a2c25; --tight: #f3be62; --tight-bg: #33270f; --tight-line: #7a5a1c;
    --meal: #f0b45e; --meal-bg: #261f12; --ok: #6fd39b; --ok-bg: #11301f; --todo: #f3be62; --todo-bg: #33270f;
    --m-fly: #a9bdf3; --m-fly-bg: #1c2645; --m-rail: #79d6a0; --m-rail-bg: #12301f; --m-metro: #8db6ef; --m-metro-bg: #172a40;
    --m-bus: #f3be62; --m-bus-bg: #33270f; --m-taxi: #ff9a8d; --m-taxi-bg: #3a1916; --m-walk: #b9c2cb; --m-walk-bg: #252b32;
    --m-bike: #cfa6f5; --m-bike-bg: #2c1d3d;
    --board-bg: #0a0d10; --board-line: #232a31; --board-chip: #161c22; --scrim: rgba(0, 0, 0, 0.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1215; --card: #171b20; --ink: #e8ebee; --ink-2: #c3cad2; --muted: #98a3ae; --line: #2a3138; --soft: #1d2228;
  --link: #8db6ef; --sel-bg: #e8ebee; --sel-fg: #0f1215;
  --cn: #e2b35a; --cn-bg: #2d2412; --kr: #82a9ea; --kr-bg: #172338; --jp: #ff8f80; --jp-bg: #3a1916; --au: #aab3bc; --au-bg: #232930;
  --fix: #ff8578; --fix-bg: #3a1714; --fix-line: #7a2c25; --tight: #f3be62; --tight-bg: #33270f; --tight-line: #7a5a1c;
  --meal: #f0b45e; --meal-bg: #261f12; --ok: #6fd39b; --ok-bg: #11301f; --todo: #f3be62; --todo-bg: #33270f;
  --m-fly: #a9bdf3; --m-fly-bg: #1c2645; --m-rail: #79d6a0; --m-rail-bg: #12301f; --m-metro: #8db6ef; --m-metro-bg: #172a40;
  --m-bus: #f3be62; --m-bus-bg: #33270f; --m-taxi: #ff9a8d; --m-taxi-bg: #3a1916; --m-walk: #b9c2cb; --m-walk-bg: #252b32;
  --m-bike: #cfa6f5; --m-bike-bg: #2c1d3d;
  --board-bg: #0a0d10; --board-line: #232a31; --board-chip: #161c22; --scrim: rgba(0, 0, 0, 0.55);
  color-scheme: dark;
}

html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--board-bg);
}
button { font: inherit; color: inherit; }
a { color: var(--link); }
:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; border-radius: 6px; }
.wrap { padding-left: var(--gut-l); padding-right: var(--gut-r); max-width: 760px; margin: 0 auto; box-sizing: border-box; }
.num { font-family: var(--f-data); font-variant-numeric: tabular-nums; }

/* ---------- top bar: a departures board, dark in both themes ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--board-bg); color: var(--board-fg);
  border-bottom: 1px solid var(--board-line);
}
.top .wrap { padding-block: 10px 10px; display: grid; gap: 9px; }
.top-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand { font-weight: 700; font-size: var(--fs-l); letter-spacing: 0.04em; white-space: nowrap; }
.status { color: var(--board-muted); font-size: var(--fs-s); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.today-btn {
  margin-left: auto; flex: none; border: 1px solid var(--board-line); background: var(--board-chip); color: var(--board-fg); border-radius: 999px;
  padding: 4px 12px; font-size: var(--fs-s); font-weight: 600; cursor: pointer;
}
.strip {
  display: flex; gap: 6px; overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
  margin-inline: calc(-1 * var(--gut-l)) calc(-1 * var(--gut-r)); padding-inline: var(--gut-l) var(--gut-r);
  -webkit-overflow-scrolling: touch;
}
.strip::-webkit-scrollbar { display: none; }
.dchip {
  flex: none; scroll-snap-align: center; position: relative; color: var(--board-fg);
  display: grid; justify-items: center; gap: 0; min-width: 50px; padding: 9px 6px 8px;
  border: 1px solid var(--board-line); border-radius: 10px; background: var(--board-chip); cursor: pointer;
}
.dchip .d { font-family: var(--f-data); font-weight: 600; font-size: 1.04rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.dchip .w { font-size: 0.68rem; color: var(--board-muted); line-height: 1.25; }
.dchip .bar { position: absolute; left: 12px; right: 12px; bottom: 3px; height: 3px; border-radius: 2px; background: var(--bc, var(--b-au)); }
.dchip[aria-current="true"] { background: var(--board-fg); border-color: var(--board-fg); color: var(--board-bg); }
.dchip[aria-current="true"] .w { color: var(--board-bg); opacity: 0.7; }
.dchip.is-today::after {
  content: ""; position: absolute; top: 3px; left: 50%; width: 14px; height: 4px; margin-left: -7px; border-radius: 2px; background: var(--board-dot);
}
.dchip.cc-cn { --bc: var(--b-cn); } .dchip.cc-kr { --bc: var(--b-kr); } .dchip.cc-jp { --bc: var(--b-jp); } .dchip.cc-au { --bc: var(--b-au); }
.cc-cn { --c: var(--cn); --cbg: var(--cn-bg); }
.cc-kr { --c: var(--kr); --cbg: var(--kr-bg); }
.cc-jp { --c: var(--jp); --cbg: var(--jp-bg); }
.cc-au { --c: var(--au); --cbg: var(--au-bg); }

/* ---------- main ---------- */
main { padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 24px); }
.view { padding-block: 16px 8px; display: grid; gap: 16px; }

/* day header */
.dhead { display: grid; gap: 6px; }
.dline { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.ddate { font-family: var(--f-data); font-weight: 700; font-size: var(--fs-date); line-height: 1; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.dwd { font-size: var(--fs-m); color: var(--muted); }
.hol { font-size: var(--fs-xs); font-weight: 600; color: var(--jp); background: var(--jp-bg); border-radius: 5px; padding: 1px 6px; }
.cities { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.ctag { font-size: var(--fs-xs); font-weight: 600; color: var(--c); background: var(--cbg); border-radius: 5px; padding: 1px 7px; }
.cities .to { color: var(--muted); font-size: var(--fs-xs); }
.dtitle { margin: 0; font-size: var(--fs-l); line-height: 1.35; font-weight: 650; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; }
.meta span { font-size: var(--fs-xs); color: var(--ink-2); border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 2px 9px; }

.warn {
  background: var(--tight-bg); border: 1px solid var(--tight-line); color: var(--ink); border-radius: 12px;
  padding: 10px 12px; font-size: var(--fs-s); line-height: 1.55;
}
.warn b { color: var(--tight); margin-right: 4px; }

/* timeline: a metro line */
.tl { list-style: none; margin: 0; padding: 12px 12px 12px 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
.stop { display: grid; grid-template-columns: 54px 22px minmax(0, 1fr); column-gap: 6px; position: relative; padding-block: 2px 12px; }
.stop:last-child { padding-bottom: 2px; }
.stop .t { text-align: right; padding-top: 1px; font-family: var(--f-data); font-weight: 600; font-size: 1.02rem; line-height: 1.3; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.stop .t.lbl { font-family: var(--f-body); font-size: var(--fs-xs); font-weight: 600; color: var(--muted); padding-top: 3px; }
.stop .rail { position: relative; }
.stop .rail::before { /* the line */
  content: ""; position: absolute; left: 50%; width: 4px; margin-left: -2px; top: 0; bottom: -2px; background: var(--c); opacity: 0.85;
}
.stop:first-child .rail::before { top: 9px; }
.stop:last-child .rail::before { bottom: auto; height: 9px; }
.stop .rail::after { /* the station */
  content: ""; position: absolute; left: 50%; top: 4px; width: 12px; height: 12px; margin-left: -8px;
  border-radius: 50%; background: var(--card); border: 2px solid var(--c);
}
.stop.meal .rail::after { width: 8px; height: 8px; margin-left: -6px; top: 6px; border-color: var(--meal); }
.stop.fix .rail::after { background: var(--c); }
.stop.tight .rail::after { background: var(--tight); border-color: var(--tight); box-shadow: 0 0 0 3px var(--tight-bg); }
.stop.fix .t { color: var(--fix); }
.stop.tight .t { color: var(--tight); }
.stop .body { min-width: 0; display: grid; gap: 3px; padding: 0 2px; border-radius: 8px; }
.stop.tight .body { background: var(--tight-bg); padding: 6px 8px; margin: -4px 0 0; }
.stop.meal .body { background: var(--meal-bg); padding: 5px 8px; margin: -3px 0 0; }
.what { font-size: var(--fs-m); font-weight: 600; line-height: 1.45; overflow-wrap: anywhere; }
.how { font-size: var(--fs-s); color: var(--ink-2); line-height: 1.6; overflow-wrap: anywhere; }
.badge { display: inline-block; font-size: 0.68rem; font-weight: 700; border-radius: 4px; padding: 0 5px; margin-left: 6px; vertical-align: 2px; line-height: 1.6; }
.badge.fix { color: var(--fix); border: 1px solid var(--fix-line); background: var(--fix-bg); }
.badge.tight { color: var(--tight); border: 1px solid var(--tight-line); background: var(--card); }
.badge.now { color: var(--sel-fg); background: var(--sel-bg); }
.mealtag { display: inline-block; font-size: 0.7rem; font-weight: 700; color: var(--meal); border: 1px solid var(--tight-line); border-radius: 4px; padding: 0 5px; margin-right: 6px; vertical-align: 2px; line-height: 1.6; }
.mode { display: inline-block; font-size: 0.7rem; font-weight: 700; border-radius: 4px; padding: 0 5px; margin-right: 3px; line-height: 1.65; vertical-align: 1px; white-space: nowrap; color: var(--mc); background: var(--mbg); }
.mode.fly { --mc: var(--m-fly); --mbg: var(--m-fly-bg); }
.mode.rail { --mc: var(--m-rail); --mbg: var(--m-rail-bg); }
.mode.metro { --mc: var(--m-metro); --mbg: var(--m-metro-bg); }
.mode.bus { --mc: var(--m-bus); --mbg: var(--m-bus-bg); }
.mode.taxi { --mc: var(--m-taxi); --mbg: var(--m-taxi-bg); }
.mode.walk { --mc: var(--m-walk); --mbg: var(--m-walk-bg); }
.mode.bike { --mc: var(--m-bike); --mbg: var(--m-bike-bg); }
.stop.is-now .body { outline: 2px solid var(--ink); outline-offset: 3px; }
@media (prefers-reduced-motion: no-preference) {
  .stop.is-now .rail::after { animation: ping 1.8s ease-out infinite; }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 var(--c); } 70%, 100% { box-shadow: 0 0 0 8px transparent; } }
}

/* panels */
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 6px; }
.panel h3 { margin: 0; font-size: var(--fs-xs); font-weight: 700; color: var(--muted); letter-spacing: 0.06em; }
.panel p { margin: 0; font-size: var(--fs-s); line-height: 1.65; color: var(--ink-2); }
.panel ul { margin: 0; padding-left: 1.1em; display: grid; gap: 4px; font-size: var(--fs-s); line-height: 1.6; color: var(--ink-2); }
.panel b { color: var(--ink); }
.two { display: grid; gap: 12px; }
@media (min-width: 620px) { .two { grid-template-columns: 1fr 1fr; } }

/* hotel card */
.hotel { display: grid; gap: 6px; }
.hotel .hname { font-size: var(--fs-m); font-weight: 650; line-height: 1.35; overflow-wrap: anywhere; }
.hotel .hsub { font-size: var(--fs-s); color: var(--muted); }
.hotel .addr { font-size: var(--fs-s); color: var(--ink); user-select: text; -webkit-user-select: text; overflow-wrap: anywhere; }
.hotel .acc { font-size: var(--fs-xs); color: var(--muted); }
.st { display: inline-block; font-size: 0.68rem; font-weight: 700; border-radius: 4px; padding: 0 5px; margin-left: 6px; vertical-align: 2px; line-height: 1.6; }
.st.ok, .chip.ok { color: var(--ok); background: var(--ok-bg); }
.st.todo, .chip.todo { color: var(--todo); background: var(--todo-bg); }
.acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--soft); color: var(--ink);
  border-radius: 999px; padding: 6px 12px; font-size: var(--fs-s); font-weight: 600; text-decoration: none; cursor: pointer; min-height: 34px; box-sizing: border-box;
}
.btn.primary { background: var(--sel-bg); color: var(--sel-fg); border-color: var(--sel-bg); }
.btn svg { width: 15px; height: 15px; flex: none; }

/* pager */
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pg { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 12px; text-align: left; cursor: pointer; display: grid; gap: 2px; min-width: 0; }
.pg.next { text-align: right; }
.pg .k { font-size: var(--fs-xs); color: var(--muted); }
.pg .v { font-weight: 600; font-size: var(--fs-s); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pg[disabled] { visibility: hidden; }

/* overview */
.hero { display: grid; gap: 4px; }
.hero h1 { margin: 0; font-size: var(--fs-xl); line-height: 1.2; text-wrap: balance; }
.hero p { margin: 0; color: var(--muted); font-size: var(--fs-s); }
.route { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 2px; }
.route .rs { font-size: var(--fs-s); font-weight: 600; color: var(--c); background: var(--cbg); border-radius: 6px; padding: 2px 8px; white-space: nowrap; }
.route .rs small { font-weight: 500; margin-left: 4px; opacity: 0.85; }
.route .ar { color: var(--muted); font-size: var(--fs-xs); padding: 0 2px; }
.ovlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.ovday {
  width: 100%; display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 10px; text-align: left;
  background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; cursor: pointer;
}
.ovday.is-today { border-color: var(--ink); }
.ovday .od { display: grid; align-content: start; gap: 1px; }
.ovday .od .n { font-family: var(--f-data); font-weight: 700; font-size: 1.15rem; line-height: 1.15; font-variant-numeric: tabular-nums; }
.ovday .od .w { font-size: var(--fs-xs); color: var(--muted); }
.ovday .od .u { height: 3px; width: 28px; border-radius: 2px; background: var(--c); margin-top: 4px; }
.ovday .oc { min-width: 0; display: grid; gap: 4px; }
.ovday .om { font-size: var(--fs-s); line-height: 1.55; color: var(--ink); overflow-wrap: anywhere; }
.ovday .ot { font-size: var(--fs-xs); line-height: 1.55; color: var(--muted); overflow-wrap: anywhere; }
.chip { display: inline-block; font-size: 0.68rem; font-weight: 700; border-radius: 4px; padding: 0 5px; margin-right: 4px; vertical-align: 1px; line-height: 1.65; white-space: nowrap; }
h2.sec { margin: 6px 0 -4px; font-size: var(--fs-xs); font-weight: 700; color: var(--muted); letter-spacing: 0.08em; }

/* lists of cards (notes, shopping) */
.cards { display: grid; gap: 10px; }
@media (min-width: 620px) { .cards.c2 { grid-template-columns: 1fr 1fr; } }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 4px; min-width: 0; }
.card .ct { font-weight: 650; font-size: var(--fs-m); line-height: 1.4; overflow-wrap: anywhere; }
.card .cw { font-size: var(--fs-xs); color: var(--ink-2); display: flex; gap: 6px; align-items: baseline; }
.card .cw .k { flex: none; font-weight: 700; color: var(--muted); }
.card .cn { font-size: var(--fs-s); color: var(--muted); line-height: 1.6; overflow-wrap: anywhere; }
.card .cn b, .card .ct b { color: var(--ink); }
.grp-h { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.grp-h .ctag { font-size: var(--fs-s); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: var(--fs-xs); color: var(--muted); }
.foot-note { font-size: var(--fs-xs); color: var(--muted); text-align: center; padding-top: 4px; }
.foot-note button { border: 0; background: none; color: var(--link); text-decoration: underline; cursor: pointer; font-size: inherit; padding: 4px; }

/* bottom tabs */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  background: var(--card); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabbar .wrap { display: grid; grid-template-columns: repeat(4, 1fr); height: var(--tabbar-h); }
.tab { border: 0; background: none; display: grid; justify-items: center; align-content: center; gap: 2px; color: var(--muted); font-size: 0.7rem; font-weight: 600; cursor: pointer; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-selected="true"] { color: var(--ink); }

/* place buttons and the map sheet */
.places { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 3px; }
.pl {
  display: inline-flex; align-items: center; gap: 4px; min-height: 28px; box-sizing: border-box;
  border: 1px solid var(--line); background: var(--card); color: var(--link); border-radius: 999px;
  padding: 2px 10px 2px 7px; font-size: var(--fs-xs); font-weight: 600; line-height: 1.35; cursor: pointer; text-align: left;
}
.pl svg { width: 13px; height: 13px; flex: none; }
.stop.tight .pl, .stop.meal .pl { background: var(--card); }
.sheet-bg { position: fixed; inset: 0; z-index: 50; background: var(--scrim); }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 51; background: var(--card); color: var(--ink);
  border-top: 1px solid var(--line); border-radius: 18px 18px 0 0; box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.18);
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); max-height: 80vh; overflow: auto;
}
.sheet-in { padding-block: 16px 4px; display: grid; gap: 14px; }
.sheet-head { display: flex; gap: 12px; align-items: flex-start; }
.sheet-txt { min-width: 0; display: grid; gap: 2px; }
.sheet-t { font-size: var(--fs-l); font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.sheet-q { font-size: var(--fs-s); color: var(--muted); user-select: text; -webkit-user-select: text; overflow-wrap: anywhere; }
.sheet-x { margin-left: auto; flex: none; border: 0; background: var(--soft); color: var(--ink-2); width: 34px; height: 34px; border-radius: 50%; font-size: 22px; line-height: 1; cursor: pointer; }
.sheet-acts { display: grid; gap: 8px; }
.sheet-acts .btn { justify-content: center; min-height: 46px; font-size: var(--fs-m); border-radius: 12px; }
.sheet-note { font-size: var(--fs-xs); color: var(--muted); margin: 0; }

/* lock screen (web copy only) */
.lock { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: grid; place-items: center; overflow: auto;
  padding: calc(24px + env(safe-area-inset-top, 0px)) var(--gut-r) calc(24px + env(safe-area-inset-bottom, 0px)) var(--gut-l); }
.lock form { width: min(360px, 100%); display: grid; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; box-sizing: border-box; }
.lock h1 { margin: 0; font-size: var(--fs-xl); }
.lock p { margin: 0; color: var(--muted); font-size: var(--fs-s); line-height: 1.6; }
.lock input[type="password"] { font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--soft); color: var(--ink); width: 100%; box-sizing: border-box; }
.lock label.keep { display: flex; gap: 8px; align-items: center; font-size: var(--fs-s); color: var(--ink-2); }
.lock .err { color: var(--fix); font-size: var(--fs-s); min-height: 1.2em; }
.lock button { min-height: 44px; border-radius: 10px; justify-content: center; font-size: var(--fs-m); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 14px); z-index: 60;
  background: var(--sel-bg); color: var(--sel-fg); border-radius: 999px; padding: 8px 16px; font-size: var(--fs-s); font-weight: 600; }

</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="top-row">
      <span class="brand">韩日行程</span>
      <span class="status" id="status"></span>
      <button class="today-btn" id="todayBtn" type="button" hidden>回到今天</button>
    </div>
    <nav class="strip" id="strip" aria-label="选择日期"></nav>
  </div>
</header>

<main>
  <div class="wrap">
    <section class="view" id="v-day" aria-label="每天"></section>
    <section class="view" id="v-ov" aria-label="总览" hidden></section>
    <section class="view" id="v-notes" aria-label="须知" hidden></section>
    <section class="view" id="v-shop" aria-label="购物" hidden></section>
  </div>
</main>

<nav class="tabbar" aria-label="分区">
  <div class="wrap" role="tablist">
    <button class="tab" id="tab-day" role="tab" type="button" data-tab="day" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/><circle cx="12" cy="14.6" r="1.7" fill="currentColor" stroke="none"/></svg>每天</button>
    <button class="tab" id="tab-ov" role="tab" type="button" data-tab="ov" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 5v14"/><circle cx="6" cy="5" r="2"/><circle cx="6" cy="12" r="2"/><circle cx="6" cy="19" r="2"/><path d="M11 5h9M11 12h9M11 19h9"/></svg>总览</button>
    <button class="tab" id="tab-notes" role="tab" type="button" data-tab="notes" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5"/><circle cx="12" cy="7.8" r="1.1" fill="currentColor" stroke="none"/></svg>须知</button>
    <button class="tab" id="tab-shop" role="tab" type="button" data-tab="shop" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8L5 8z"/><path d="M9 10V7a3 3 0 0 1 6 0v3"/></svg>购物</button>
  </div>
</nav>

<div class="sheet-bg" id="sheetBg" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="wrap sheet-in">
    <div class="sheet-head">
      <div class="sheet-txt"><div class="sheet-t" id="sheetTitle"></div><div class="sheet-q" id="sheetQ"></div></div>
      <button class="sheet-x" id="sheetX" type="button" aria-label="关闭">×</button>
    </div>
    <div class="sheet-acts" id="sheetActs"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" hidden></div>
<div class="lock" id="lock" hidden>
  <form id="lockForm" autocomplete="off">
    <h1>韩日行程</h1>
    <p>行程里有航班、酒店和订单信息，所以加了密。密码和看板的一样，每台设备输一次就行。</p>
    <input type="password" id="lockPw" name="password" placeholder="密码" aria-label="密码" autocomplete="current-password">
    <label class="keep"><input type="checkbox" id="lockKeep" checked> 在这台设备上记住</label>
    <div class="err" id="lockErr" role="alert"></div>
    <button class="btn primary" id="lockGo" type="submit">解锁</button>
  </form>
</div>
<script>
(() => {
  "use strict";
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  const MODE = { "飞机": "fly", "火车": "rail", "新干线": "rail", "KTX": "rail", "高铁": "rail", "机场快线": "rail",
    "地铁": "metro", "电车": "metro", "单轨": "metro", "公交": "bus", "大巴": "bus", "小巴": "bus", "班车": "bus",
    "打车": "taxi", "步行": "walk", "骑车": "bike" };
  const ICON = {
    copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="11" height="12" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></svg>',
    map: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>'
  };
  const INLINE = !!document.getElementById("trip-data");  // the Claude copy (data inline, no lock)
  const MEAL_RE = /^(早饭|午饭|晚饭|下午茶|零食)：/;
  const TIME_RE = /^(\d{1,2}):(\d{2})$/;

  let T = null;
  const S = { tab: "day", i: 0, lastNav: 0, extra: "" };

  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const bold = s => s.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  const fmtInline = s => bold(esc(s).replace(/\[\[(ok|todo)\|([^\]]+)\]\]/g, '<span class="chip $1">$2</span>'));
  const fmtHow = s => esc(s).replace(/\[([^\[\]]{1,6})\]/g, (m, n) => MODE[n] ? `<span class="mode ${MODE[n]}">${n}</span>` : m);
  const isoLocal = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const toDate = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const todayIdx = () => T.days.findIndex(d => d.date === isoLocal());
  function phase() { const t = isoLocal(); return t < T.start ? "before" : t > T.end ? "after" : "during"; }
  const cityTags = list => list.map((c, k) => (k ? '<span class="to">→</span>' : "") + `<span class="ctag cc-${esc(c.cc)}">${esc(c.name)}</span>`).join("");
  const hotelOf = d => T.hotels.find(h => h.id === d.hotel) || null;

  // ---------------------------------------------------------------- header
  function renderStatus() {
    const p = phase(), el = $("#status");
    if (p === "before") {
      const n = Math.round((toDate(T.start) - toDate(isoLocal())) / 864e5);
      el.textContent = `${T.days[0].md} 出发 · 还有 ${n} 天`;
    } else if (p === "during") {
      el.textContent = `第 ${todayIdx() + 1} 天 · 共 ${T.days.length} 天`;
    } else el.textContent = "行程已结束";
    const ti = todayIdx();
    $("#todayBtn").hidden = !(ti >= 0 && (S.tab !== "day" || S.i !== ti));
  }
  function buildStrip() {
    $("#strip").innerHTML = T.days.map((d, k) =>
      `<button class="dchip cc-${esc(d.cc)}" type="button" data-day="${k}" aria-label="${esc(d.md + " " + d.wd + " " + d.title)}"><span class="d">${esc(d.md)}</span><span class="w">${esc(d.wd.replace("周", ""))}</span><span class="bar"></span></button>`).join("");
  }
  function syncStrip(center) {
    const ti = todayIdx();
    $$("#strip .dchip").forEach((b, k) => {
      b.setAttribute("aria-current", k === S.i ? "true" : "false");
      b.classList.toggle("is-today", k === ti);
    });
    if (center) {
      const strip = $("#strip"), b = strip.children[S.i];
      if (b) strip.scrollTo({ left: Math.max(0, b.offsetLeft - strip.clientWidth / 2 + b.clientWidth / 2), behavior: center === "smooth" ? "smooth" : "auto" });
    }
  }

  // ---------------------------------------------------------------- day view
  function currentRow(d) {
    const now = new Date(), mins = now.getHours() * 60 + now.getMinutes();
    let cur = -1;
    d.rows.forEach((r, k) => { const m = TIME_RE.exec(r.t); if (m && (+m[1]) * 60 + (+m[2]) <= mins) cur = k; });
    return cur;
  }
  // Map links for one place. Search names are in the local language, so the local map apps find them.
  function mapLinks(p) {
    const q = encodeURIComponent(p.q), L = [];
    const gDir = `https://www.google.com/maps/dir/?api=1&destination=${q}&travelmode=transit`;
    const gPlace = `https://www.google.com/maps/search/?api=1&query=${q}`;
    const apple = `https://maps.apple.com/?q=${q}`;
    if (p.c === "kr") {
      // nmap:// opens the Naver Map app straight away (its web links only open the website)
      L.push({ label: "Naver 地图（打开 App）", url: `nmap://search?query=${q}&appname=io.github.leonzzj.trip`, primary: true, app: true });
      L.push({ label: "Naver 网页版", url: `https://map.naver.com/p/search/${q}` });
      L.push({ label: "Google 地图路线", url: gDir });
    } else if (p.c === "jp") {
      L.push({ label: "Google 地图路线", url: gDir, primary: true });
      L.push({ label: "Google 地图看地点", url: gPlace });
      L.push({ label: "Apple 地图", url: apple });
    } else if (p.c === "cn") {
      L.push({ label: "Apple 地图", url: apple, primary: true });
      L.push({ label: "高德地图", url: `https://uri.amap.com/search?keyword=${q}&callnative=1` });
    } else {
      L.push({ label: "Google 地图路线", url: gDir, primary: true });
      L.push({ label: "Apple 地图", url: apple });
    }
    return L;
  }
  let sheetFrom = null;
  function openSheet(p, from) {
    sheetFrom = from || null;
    $("#sheetTitle").textContent = p.n;
    $("#sheetQ").textContent = p.q;
    const lang = p.c === "kr" ? "韩文名" : p.c === "jp" ? "日文名" : "名称";
    $("#sheetActs").innerHTML = mapLinks(p).map(l =>
      `<a class="btn${l.primary ? " primary" : ""}" href="${esc(l.url)}"${l.app ? ' data-app="1"' : ' target="_blank" rel="noopener"'}>${ICON.map}${esc(l.label)}</a>`).join("") +
      `<button class="btn" type="button" data-copy="${esc(p.q)}">${ICON.copy}复制${lang}</button>` +
      (p.c === "kr" ? '<p class="sheet-note">要先在 App Store 装「네이버 지도」（Naver Map）。没跳过去就点「Naver 网页版」。</p>' : "");
    $("#sheetBg").hidden = false; $("#sheet").hidden = false;
    const first = $("#sheetActs .btn"); if (first) first.focus({ preventScroll: true });
  }
  function closeSheet() {
    if ($("#sheet").hidden) return;
    $("#sheetBg").hidden = true; $("#sheet").hidden = true;
    if (sheetFrom && document.body.contains(sheetFrom)) sheetFrom.focus({ preventScroll: true });
  }
  function placesHTML(r, k) {
    if (!r.places || !r.places.length) return "";
    return `<div class="places">${r.places.map((p, j) =>
      `<button class="pl" type="button" data-pl="${k}:${j}" aria-label="${esc("导航到 " + p.n)}">${ICON.map}${esc(p.n)}</button>`).join("")}</div>`;
  }
  function stopHTML(r, now, k) {
    const timed = TIME_RE.test(r.t);
    let what = r.what, tag = "";
    const mm = MEAL_RE.exec(what);
    if (mm) { what = what.slice(mm[0].length); if (r.t !== mm[1]) tag = `<span class="mealtag">${mm[1]}</span>`; }
    const fix = r.flag === "fix" || r.flag === "fixtight", tight = r.flag === "tight" || r.flag === "fixtight";
    const cls = ["stop", fix && "fix", tight && "tight", mm && "meal", now && "is-now"].filter(Boolean).join(" ");
    const badges = (fix ? '<span class="badge fix">固定</span>' : "") + (tight ? '<span class="badge tight">紧</span>' : "") + (now ? '<span class="badge now">现在</span>' : "");
    return `<li class="${cls}"><span class="t${timed ? "" : " lbl"}">${esc(r.t)}</span><span class="rail" aria-hidden="true"></span>` +
      `<div class="body"><div class="what">${tag}${esc(what)}${badges}</div>${r.how ? `<div class="how">${fmtHow(r.how)}</div>` : ""}${placesHTML(r, k)}</div></li>`;
  }
  function hotelCard(h, opts = {}) {
    const st = h.status ? `<span class="st ${h.status.includes("待") ? "todo" : "ok"}">${esc(h.status)}</span>` : "";
    const head = opts.withCity ? `<span class="ctag cc-${esc(h.cc)}">${esc(h.city)}${h.nights ? " " + esc(h.nights) : ""}</span>` : "";
    const addr = h.addr.map(a => `<div class="addr">${esc(a)}</div>`).join("");
    const acc = h.access.length ? `<div class="acc">${h.access.map(esc).join(" · ")}</div>` : "";
    const copy = h.copy ? `<button class="btn primary" type="button" data-copy="${esc(h.copy)}">${ICON.copy}${h.addr.length ? "复制地址" : "复制名称"}</button>` : "";
    const maps = h.maps.map(m => `<a class="btn" href="${esc(m.url)}" target="_blank" rel="noopener">${ICON.map}${esc(m.label)}</a>`).join("");
    return `<div class="hotel">${head ? `<div>${head}</div>` : ""}<div class="hname">${esc(h.name)}${st}</div>${h.sub ? `<div class="hsub">${esc(h.sub)}</div>` : ""}${addr}${acc}<div class="acts">${copy}${maps}</div></div>`;
  }
  function renderDay() {
    const d = T.days[S.i], ti = todayIdx(), isToday = ti === S.i;
    const nowRow = isToday ? currentRow(d) : -1;
    const meta = d.meta.split(" · ").map(m => `<span>${esc(m)}</span>`).join("");
    const h = hotelOf(d);
    let stay = "";
    if (h && h.name) stay = `<div class="panel"><h3>今晚住</h3>${hotelCard(h)}</div>`;
    else if (h) stay = `<div class="panel"><h3>今晚</h3><p>${esc(h.city)}</p></div>`;
    const prev = T.days[S.i - 1], next = T.days[S.i + 1];
    const pg = (x, k, cls, label) => x
      ? `<button class="pg ${cls}" type="button" data-day="${k}"><span class="k">${label}</span><span class="v">${esc(x.md + " " + x.wd)} · ${esc(x.title)}</span></button>`
      : `<button class="pg ${cls}" type="button" disabled></button>`;
    $("#v-day").innerHTML = `
      <div class="dhead">
        <div class="dline"><span class="ddate">${esc(d.md)}</span><span class="dwd">${esc(d.wd)}</span>${d.hol ? `<span class="hol">${esc(d.hol)}</span>` : ""}${isToday ? '<span class="badge now">今天</span>' : ""}</div>
        <div class="cities">${cityTags(d.cities)}</div>
        <h2 class="dtitle">${esc(d.title)}</h2>
        <div class="meta">${meta}</div>
      </div>
      ${d.warn ? `<div class="warn" role="note"><b>时间紧</b>${esc(d.warn)}</div>` : ""}
      <ol class="tl cc-${esc(d.cc)}">${d.rows.map((r, k) => stopHTML(r, k === nowRow, k)).join("")}</ol>
      <div class="two">
        <div class="panel"><h3>今天带</h3><p>${esc(d.bring)}</p></div>
        ${d.tips ? `<div class="panel"><h3>提醒</h3><p>${esc(d.tips)}</p></div>` : ""}
      </div>
      ${stay}
      <div class="pager">${pg(prev, S.i - 1, "prev", "← 前一天")}${pg(next, S.i + 1, "next", "后一天 →")}</div>`;
  }

  // ---------------------------------------------------------------- overview
  function renderOv() {
    const ti = todayIdx(), first = T.days[0], last = T.days[T.days.length - 1];
    const route = T.route.map((r, k) => (k ? '<span class="ar">→</span>' : "") +
      `<span class="rs cc-${esc(r.cc)}">${esc(r.city)}${r.nights ? `<small>${esc(r.nights)}</small>` : ""}</span>`).join("");
    const days = T.days.map((d, k) => `<li><button class="ovday cc-${esc(d.cc)}${k === ti ? " is-today" : ""}" type="button" data-go="${k}">
        <span class="od"><span class="n">${esc(d.md)}</span><span class="w">${esc(d.wd)}${d.hol ? " · 假日" : ""}${k === ti ? " · 今天" : ""}</span><span class="u"></span></span>
        <span class="oc"><span class="cities">${cityTags(d.cities)}</span><span class="om">${fmtInline(d.main)}</span>${d.tip ? `<span class="ot">${fmtInline(d.tip)}</span>` : ""}</span>
      </button></li>`).join("");
    const foot = T.foot.map(b => `<div class="panel"><h3>${esc(b.h)}</h3><ul>${b.items.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`).join("");
    const hotels = T.hotels.filter(h => h.name).map(h => `<div class="panel">${hotelCard(h, { withCity: true })}</div>`).join("");
    $("#v-ov").innerHTML = `
      <div class="hero"><h1>${esc(T.title)}</h1><p class="num">${esc(first.md)}（${esc(first.wd)}）– ${esc(last.md)}（${esc(last.wd)}）· ${T.days.length} 天</p><p>更新于 ${esc(T.updated)}</p></div>
      <div class="route">${route}</div>
      <h2 class="sec">每一天</h2>
      <ol class="ovlist">${days}</ol>
      <h2 class="sec">交通和门票</h2>
      <div class="cards c2">${foot}</div>
      <h2 class="sec">住宿</h2>
      <div class="cards c2">${hotels}</div>`;
  }

  // ---------------------------------------------------------------- notes
  function renderNotes() {
    const notes = T.notes.map(n => `<div class="panel"><h3>${esc(n.h)}</h3><ul>${n.items.map(x => `<li>${bold(esc(x))}</li>`).join("")}</ul></div>`).join("");
    const modes = ["飞机", "高铁", "电车", "地铁", "公交", "打车", "步行", "骑车"].map(n => `<span class="mode ${MODE[n]}">${n}</span>`).join("");
    const legend = `<div class="panel"><h3>图例</h3><div class="legend">${modes}</div>
      <div class="legend"><span><span class="badge fix" style="margin-left:0">固定</span> 航班、车票、开门时间，不能晚</span><span><span class="badge tight" style="margin-left:0">紧</span> 时间卡得紧，旁边写了赶不上怎么办</span><span><span class="mealtag">午饭</span>第一家是首选</span></div></div>`;
    const tables = T.analysis.tables.map(t => `<h2 class="sec">${esc(t.h)}</h2><div class="cards c2">${t.rows.map(r =>
      `<div class="card"><div class="ct">${bold(esc(r[0]))}</div>${r.slice(1).map((v, k) => `<div class="cw"><span class="k">${esc(t.cols[k + 1])}</span><span>${bold(esc(v))}</span></div>`).join("")}</div>`).join("")}</div>`).join("");
    $("#v-notes").innerHTML = `${notes}${legend}${tables}${T.analysis.note ? `<div class="panel"><h3>帖子里反复出现的提醒</h3><p>${esc(T.analysis.note)}</p></div>` : ""}
      <p class="foot-note">内容和 PDF 详细版一致 · 更新于 ${esc(T.updated)}${S.extra}</p>`;
  }

  // ---------------------------------------------------------------- shopping
  function renderShop() {
    const s = T.shopping;
    const rules = `<div class="panel"><h3>先看规矩</h3><ul>${s.rules.map(x => `<li>${bold(esc(x))}</li>`).join("")}</ul></div>`;
    const groups = s.groups.map(g => `<div class="grp-h"><span class="ctag cc-${esc(g.cc)}">${esc(g.name)}</span></div>
      <div class="cards c2">${g.items.map(it => `<div class="card"><div class="ct">${bold(esc(it.what))}</div><div class="cw"><span class="k">在哪买</span><span>${bold(esc(it.where))}</span></div><div class="cn">${bold(esc(it.note))}</div></div>`).join("")}</div>`).join("");
    $("#v-shop").innerHTML = rules + groups;
  }

  // ---------------------------------------------------------------- navigation
  const VIEWS = { day: "#v-day", ov: "#v-ov", notes: "#v-notes", shop: "#v-shop" };
  function setTab(tab, keepScroll) {
    if (!VIEWS[tab]) tab = "day";
    S.tab = tab; store.set("trip.tab", tab);
    Object.keys(VIEWS).forEach(k => { $(VIEWS[k]).hidden = k !== tab; });
    $$(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab ? "true" : "false"));
    $("#strip").hidden = tab !== "day";
    renderStatus();
    if (!keepScroll) window.scrollTo(0, 0);
  }
  function goDay(i, how) {
    if (!T || i < 0 || i >= T.days.length) return;
    closeSheet();
    S.i = i; S.lastNav = Date.now();
    if (phase() !== "during") store.set("trip.day", String(i));
    renderDay(); syncStrip(how === "smooth" ? "smooth" : "auto"); renderStatus();
    window.scrollTo(0, 0);
  }
  function scrollToNow() {
    const el = $("#v-day .stop.is-now");
    if (!el) return;
    const top = el.getBoundingClientRect().top + window.scrollY - $(".top").getBoundingClientRect().bottom - 16;
    window.scrollTo(0, Math.max(0, top));
  }
  let toastTimer = 0;
  function toast(msg) {
    const t = $("#toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 1800);
  }
  function copyText(text) {
    const done = () => toast("已复制：" + text);
    const fallback = () => {
      try {
        const ta = document.createElement("textarea");
        ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
        const ok = document.execCommand("copy"); ta.remove();
        ok ? done() : toast("复制不了，长按地址手动复制");
      } catch (e) { toast("复制不了，长按地址手动复制"); }
    };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
  }

  function wire() {
    document.addEventListener("click", e => {
      const pl = e.target.closest("[data-pl]");
      if (pl && T) {
        const [k, j] = pl.dataset.pl.split(":").map(Number), r = T.days[S.i].rows[k];
        if (r && r.places && r.places[j]) openSheet(r.places[j], pl);
        return;
      }
      if (e.target.closest("#sheetBg, #sheetX")) { closeSheet(); return; }
      const al = e.target.closest("#sheetActs a");
      if (al) {
        if (al.dataset.app) {  // keep the sheet open, so the web version is one tap away if the app is missing
          const t0 = Date.now();
          setTimeout(() => { if (!document.hidden && Date.now() - t0 < 8000) toast("没跳到 Naver 地图的话，点「Naver 网页版」"); }, 3000);
        } else setTimeout(closeSheet, 300);
        return;
      }
      const c = e.target.closest("[data-copy]");
      if (c) { copyText(c.getAttribute("data-copy")); return; }
      const d = e.target.closest("[data-day]");
      if (d && !d.disabled) { goDay(+d.dataset.day, d.closest("#strip") ? "smooth" : ""); return; }
      const g = e.target.closest("[data-go]");
      if (g) { setTab("day", true); goDay(+g.dataset.go, "smooth"); return; }
      const t = e.target.closest(".tab");
      if (t) { setTab(t.dataset.tab); if (t.dataset.tab === "day") syncStrip("auto"); }
    });
    $("#todayBtn").addEventListener("click", () => {
      const ti = todayIdx(); if (ti < 0) return;
      setTab("day", true); goDay(ti, "smooth"); scrollToNow();
    });
    let sx = 0, sy = 0, st = 0;
    const v = $("#v-day");
    v.addEventListener("touchstart", e => { const t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; st = Date.now(); }, { passive: true });
    v.addEventListener("touchend", e => {
      const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
      if (Date.now() - st < 650 && Math.abs(dx) > 70 && Math.abs(dy) < 45) goDay(S.i + (dx < 0 ? 1 : -1), "smooth");
    }, { passive: true });
    document.addEventListener("keydown", e => {
      if (e.key === "Escape") { closeSheet(); return; }
      if (!$("#sheet").hidden) return;
      if (S.tab !== "day" || e.altKey || e.metaKey || e.ctrlKey || /input|textarea/i.test((e.target.tagName || ""))) return;
      if (e.key === "ArrowRight") goDay(S.i + 1, "smooth");
      if (e.key === "ArrowLeft") goDay(S.i - 1, "smooth");
    });
    // keep "today" and the "now" mark current
    setInterval(() => { if (!T) return; if (S.tab === "day" && todayIdx() === S.i) renderDay(); renderStatus(); syncStrip(); }, 60000);
    document.addEventListener("visibilitychange", () => {
      if (document.hidden || !T) return;
      const ti = todayIdx();
      if (ti >= 0 && ti !== S.i && Date.now() - S.lastNav > 30 * 6e4) { setTab("day", true); goDay(ti); scrollToNow(); }
      else { renderStatus(); syncStrip(); if (S.tab === "day") renderDay(); }
    });
  }

  function start(data, extraNote) {
    T = data; S.extra = extraNote || "";
    buildStrip();
    const ti = todayIdx(), saved = parseInt(store.get("trip.day"), 10);
    S.i = ti >= 0 ? ti : (saved >= 0 && saved < T.days.length ? saved : 0);
    renderDay(); renderOv(); renderNotes(); renderShop();
    const tab = store.get("trip.tab");
    setTab(ti >= 0 ? "day" : (VIEWS[tab] ? tab : "day"), true);
    syncStrip("auto");
    if (ti >= 0) requestAnimationFrame(scrollToNow);
  }
  function refresh(data, extraNote) {
    T = data; S.extra = extraNote || S.extra;
    if (S.i >= T.days.length) S.i = 0;
    buildStrip(); renderDay(); renderOv(); renderNotes(); renderShop(); syncStrip(); renderStatus();
  }

  window.__trip = { start, refresh, wire, isReady: () => !!T };
  wire();
  const inline = document.getElementById("trip-data");
  if (inline) start(JSON.parse(inline.textContent));
})();

</script>
<script>
(() => {
  "use strict";
  // Web copy only: the itinerary is encrypted (same key pair and password as the dashboard).
  const $ = s => document.querySelector(s);
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  // Same IndexedDB store as the dashboard, so a device that unlocked one page can open the other.
  const idb = (() => {
    const open = () => new Promise((res, rej) => { const r = indexedDB.open("dashboard", 1); r.onupgradeneeded = () => r.result.createObjectStore("keys"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
    const run = (mode, fn) => open().then(db => new Promise((res, rej) => {
      const tx = db.transaction("keys", mode), rq = fn(tx.objectStore("keys"));
      tx.oncomplete = () => { db.close(); res(rq ? rq.result : undefined); };
      tx.onerror = tx.onabort = () => { db.close(); rej(tx.error); };
    }));
    return { get: k => run("readonly", st => st.get(k)), set: (k, v) => run("readwrite", st => st.put(v, k)), del: k => run("readwrite", st => st.delete(k)) };
  })();
  async function getJSON(url) {
    let r;
    try { r = await fetch(url, { cache: "no-cache" }); } catch (e) { throw Object.assign(new Error("offline"), { net: true }); }
    if (!r.ok) throw Object.assign(new Error("HTTP " + r.status), { net: true });
    return { json: await r.json(), cached: r.headers.get("x-trip-cache") === "1" };
  }
  async function keyFromPassword(pw) {
    const kf = (await getJSON("key.enc.json")).json;
    const pwKey = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const aes = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(kf.salt), iterations: kf.iter, hash: "SHA-256" }, pwKey, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    let der;
    try { der = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(kf.iv) }, aes, b64(kf.ct)); }
    catch (e) { throw Object.assign(new Error("Wrong password"), { wrong: true }); }
    return crypto.subtle.importKey("pkcs8", der, { name: "RSA-OAEP", hash: "SHA-256" }, false, ["decrypt"]);
  }
  async function openData(priv, f) {
    const raw = await crypto.subtle.decrypt({ name: "RSA-OAEP" }, priv, b64(f.wk));
    const k = await crypto.subtle.importKey("raw", raw, { name: "AES-GCM" }, false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(f.iv) }, k, b64(f.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }

  let priv = null, lastCheck = 0;
  async function openTrip(first) {
    const res = await getJSON("data.enc.json");
    const doc = await openData(priv, res.json);
    lastCheck = Date.now();
    const at = String(res.json.at || doc.at || "").slice(0, 16).replace("T", " ");
    const extra = ` · 网页数据 ${at}${res.cached ? "（离线副本）" : ""}<br><button type="button" id="lockNow">锁定这台设备</button>`;
    if (first || !window.__trip.isReady()) window.__trip.start(doc.data, extra);
    else window.__trip.refresh(doc.data, extra);
    $("#lock").hidden = true;
  }
  function showLock(msg) {
    $("#lock").hidden = false;
    $("#lockErr").textContent = msg || "";
  }
  $("#lockForm").addEventListener("submit", async e => {
    e.preventDefault();
    const pw = $("#lockPw").value; if (!pw) { $("#lockPw").focus(); return; }
    const btn = $("#lockGo"); btn.disabled = true; btn.textContent = "解锁中…"; $("#lockErr").textContent = "";
    try {
      priv = await keyFromPassword(pw);
      if ($("#lockKeep").checked) { try { await idb.set("priv", priv); } catch (err) {} }
      await openTrip(true);
      $("#lockPw").value = ""; $("#lockPw").blur();
    } catch (err) {
      priv = null;
      $("#lockErr").textContent = err && err.wrong ? "密码不对，再试一次。" : "加载不了数据。检查网络后再试。";
    } finally { btn.disabled = false; btn.textContent = "解锁"; }
  });
  document.addEventListener("click", async e => {
    if (!e.target.closest("#lockNow")) return;
    try { await idb.del("priv"); } catch (err) {}
    location.reload();
  });
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && priv && Date.now() - lastCheck > 10 * 6e4) openTrip(false).catch(() => {});
  });

  async function boot() {
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js", { scope: "./" }).catch(() => {});
    if (!(window.crypto && crypto.subtle)) { showLock("要用 https 打开这个网页才能解锁。"); return; }
    try { priv = await idb.get("priv"); } catch (e) {}
    if (priv) {
      try { await openTrip(true); return; }
      catch (e) {
        if (e && e.net) { showLock("连不上网，加载不了数据。联网后再刷新。"); return; }
        try { await idb.del("priv"); } catch (err) {}
        priv = null;
      }
    }
    showLock();
  }
  boot();
})();

</script>
</body>
