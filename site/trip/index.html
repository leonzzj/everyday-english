<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>韩日行程</title>
<meta name="robots" content="noindex,nofollow">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="行程">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: a pocket timetable. A dark departures board on top; each day opens with a postcard
   (date, weather, route), then the day drawn as a metro line in the country's colour. */
:root {
  --bg: #eef1f4;
  --card: #ffffff;
  --ink: #161b21;
  --ink-2: #3a444f;
  --muted: #6a7581;
  --line: #e2e6eb;
  --soft: #f3f5f7;
  --link: #1f5fa8;
  --chip: #ecf2fb;
  --chip-ink: #1d5aa0;
  --sel-bg: #161b21;
  --sel-fg: #ffffff;
  --shadow: 0 1px 2px rgba(16, 24, 40, 0.05), 0 8px 24px rgba(16, 24, 40, 0.06);
  --scrim: rgba(16, 20, 24, 0.4);

  --cn: #9a6a12;  --cn-bg: #f7eedb;
  --kr: #2a5ba6;  --kr-bg: #e3ecfa;
  --jp: #c0392b;  --jp-bg: #fae8e6;
  --au: #56606b;  --au-bg: #eaeef2;

  --fix: #b42318;   --fix-bg: #fdeceb;   --fix-line: #f1b5ad;
  --tight: #9a5a00; --tight-bg: #fff4de; --tight-line: #efc27c;
  --meal: #9a5a00;  --meal-bg: #fff8ec;
  --ok: #1e7a46;    --ok-bg: #e2f3e8;
  --todo: #9a5a00;  --todo-bg: #fff0d6;
  --rain: #2f6fd0;
  --sun: #e8a300;
  --wait-lo: #2e9d63; --wait-mid: #e09b16; --wait-hi: #d1493b;

  --m-fly: #2a4a9c;   --m-fly-bg: #e6ecfa;
  --m-rail: #1e7a46;  --m-rail-bg: #e2f3e8;
  --m-metro: #1f5fa8; --m-metro-bg: #e6f0fb;
  --m-bus: #9a5a00;   --m-bus-bg: #fff0d6;
  --m-taxi: #b42318;  --m-taxi-bg: #fde8e6;
  --m-walk: #4b5563;  --m-walk-bg: #eceff2;
  --m-bike: #6b2fa3;  --m-bike-bg: #f1e8fb;

  --board-bg: #151a1f; --board-fg: #f2f4f6; --board-muted: #9ba6b1; --board-line: #2b333b; --board-chip: #1f262d; --board-dot: #ff7a66;
  --b-cn: #e2b35a; --b-kr: #82a9ea; --b-jp: #ff8f80; --b-au: #aab3bc;

  --f-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", "Apple SD Gothic Neo", sans-serif;
  --f-data: "Barlow Semi Condensed", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  --fs-xs: 0.75rem; --fs-s: 0.85rem; --fs-m: 0.95rem; --fs-l: 1.12rem; --fs-xl: 1.5rem;
  --r-l: 20px; --r-m: 16px; --r-s: 12px;
  --gut-l: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
  --tabbar-h: 58px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1013; --card: #161a1f; --ink: #e9ecef; --ink-2: #c4cbd2; --muted: #97a2ad; --line: #262d34; --soft: #1c2127;
    --link: #8db6ef; --chip: #17253a; --chip-ink: #93bbf2; --sel-bg: #e9ecef; --sel-fg: #0d1013;
    --shadow: 0 0 0 1px #232a31; --scrim: rgba(0, 0, 0, 0.6);
    --cn: #e2b35a; --cn-bg: #2a2212; --kr: #82a9ea; --kr-bg: #15223a; --jp: #ff8f80; --jp-bg: #371816; --au: #aab3bc; --au-bg: #222830;
    --fix: #ff8578; --fix-bg: #3a1714; --fix-line: #7a2c25; --tight: #f3be62; --tight-bg: #30250f; --tight-line: #77581c;
    --meal: #f0b45e; --meal-bg: #241d12; --ok: #6fd39b; --ok-bg: #11301f; --todo: #f3be62; --todo-bg: #33270f;
    --rain: #7fb0ff; --sun: #ffc94a; --wait-lo: #5ccf8f; --wait-mid: #f3be62; --wait-hi: #ff7f70;
    --m-fly: #a9bdf3; --m-fly-bg: #1c2645; --m-rail: #79d6a0; --m-rail-bg: #12301f; --m-metro: #8db6ef; --m-metro-bg: #172a40;
    --m-bus: #f3be62; --m-bus-bg: #33270f; --m-taxi: #ff9a8d; --m-taxi-bg: #3a1916; --m-walk: #b9c2cb; --m-walk-bg: #252b32;
    --m-bike: #cfa6f5; --m-bike-bg: #2c1d3d;
    --board-bg: #0a0d10; --board-line: #222930; --board-chip: #151b21;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1013; --card: #161a1f; --ink: #e9ecef; --ink-2: #c4cbd2; --muted: #97a2ad; --line: #262d34; --soft: #1c2127;
  --link: #8db6ef; --chip: #17253a; --chip-ink: #93bbf2; --sel-bg: #e9ecef; --sel-fg: #0d1013;
  --shadow: 0 0 0 1px #232a31; --scrim: rgba(0, 0, 0, 0.6);
  --cn: #e2b35a; --cn-bg: #2a2212; --kr: #82a9ea; --kr-bg: #15223a; --jp: #ff8f80; --jp-bg: #371816; --au: #aab3bc; --au-bg: #222830;
  --fix: #ff8578; --fix-bg: #3a1714; --fix-line: #7a2c25; --tight: #f3be62; --tight-bg: #30250f; --tight-line: #77581c;
  --meal: #f0b45e; --meal-bg: #241d12; --ok: #6fd39b; --ok-bg: #11301f; --todo: #f3be62; --todo-bg: #33270f;
  --rain: #7fb0ff; --sun: #ffc94a; --wait-lo: #5ccf8f; --wait-mid: #f3be62; --wait-hi: #ff7f70;
  --m-fly: #a9bdf3; --m-fly-bg: #1c2645; --m-rail: #79d6a0; --m-rail-bg: #12301f; --m-metro: #8db6ef; --m-metro-bg: #172a40;
  --m-bus: #f3be62; --m-bus-bg: #33270f; --m-taxi: #ff9a8d; --m-taxi-bg: #3a1916; --m-walk: #b9c2cb; --m-walk-bg: #252b32;
  --m-bike: #cfa6f5; --m-bike-bg: #2c1d3d;
  --board-bg: #0a0d10; --board-line: #222930; --board-chip: #151b21;
  color-scheme: dark;
}

html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--board-bg); }
button { font: inherit; color: inherit; }
a { color: var(--link); }
:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; border-radius: 6px; }
.wrap { padding-left: var(--gut-l); padding-right: var(--gut-r); max-width: 760px; margin: 0 auto; box-sizing: border-box; }
.num { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
.ico { width: 16px; height: 16px; flex: none; vertical-align: -3px; }

/* ---------- top: a departures board, dark in both themes ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--board-bg); color: var(--board-fg); }
.top .wrap { padding-block: 10px 12px; display: grid; gap: 10px; }
.top-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand { font-weight: 700; font-size: var(--fs-l); letter-spacing: 0.04em; white-space: nowrap; }
.status { color: var(--board-muted); font-size: var(--fs-s); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.today-btn { margin-left: auto; flex: none; border: 1px solid var(--board-line); background: var(--board-chip); color: var(--board-fg); border-radius: 999px; padding: 4px 12px; font-size: var(--fs-s); font-weight: 600; cursor: pointer; }
.strip { display: flex; gap: 6px; overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none; margin-inline: calc(-1 * var(--gut-l)) calc(-1 * var(--gut-r)); padding-inline: var(--gut-l) var(--gut-r); -webkit-overflow-scrolling: touch; }
.strip::-webkit-scrollbar { display: none; }
.dchip { flex: none; scroll-snap-align: center; position: relative; color: var(--board-fg); display: grid; justify-items: center; gap: 1px; min-width: 52px; padding: 9px 6px 9px; border: 1px solid var(--board-line); border-radius: 12px; background: var(--board-chip); cursor: pointer; }
.dchip .d { font-family: var(--f-data); font-weight: 600; font-size: 1.04rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.dchip .w { font-size: 0.66rem; color: var(--board-muted); line-height: 1.25; display: flex; align-items: center; gap: 2px; white-space: nowrap; }
.dchip .w svg { width: 12px; height: 12px; }
.dchip .wi { color: var(--board-muted); }
.dchip[aria-current="true"] .wi { color: var(--board-bg); }
.dchip .bar { position: absolute; left: 13px; right: 13px; bottom: 3px; height: 3px; border-radius: 2px; background: var(--bc, var(--b-au)); }
.dchip[aria-current="true"] { background: var(--board-fg); border-color: var(--board-fg); color: var(--board-bg); }
.dchip[aria-current="true"] .w { color: var(--board-bg); opacity: 0.75; }
.dchip.is-today::after { content: ""; position: absolute; top: 3px; left: 50%; width: 14px; height: 4px; margin-left: -7px; border-radius: 2px; background: var(--board-dot); }
.dchip.cc-cn { --bc: var(--b-cn); } .dchip.cc-kr { --bc: var(--b-kr); } .dchip.cc-jp { --bc: var(--b-jp); } .dchip.cc-au { --bc: var(--b-au); }
.cc-cn { --c: var(--cn); --cbg: var(--cn-bg); }
.cc-kr { --c: var(--kr); --cbg: var(--kr-bg); }
.cc-jp { --c: var(--jp); --cbg: var(--jp-bg); }
.cc-au { --c: var(--au); --cbg: var(--au-bg); }

/* ---------- main ---------- */
main { padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 28px); }
.view { padding-block: 16px 8px; display: grid; gap: 14px; }
.card, .panel, .tl, .hero, .ovday { background: var(--card); border-radius: var(--r-m); box-shadow: var(--shadow); }

/* the day's postcard */
.hero { border-radius: var(--r-l); padding: 16px 16px 14px; display: grid; gap: 10px; background: linear-gradient(165deg, var(--cbg) 0%, var(--card) 58%); }
.hero-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: start; }
.dline { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.ddate { font-family: var(--f-data); font-weight: 700; font-size: 2.6rem; line-height: 0.95; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.dwd { font-size: var(--fs-m); color: var(--ink-2); font-weight: 600; }
.hol { font-size: var(--fs-xs); font-weight: 700; color: var(--jp); background: var(--card); border-radius: 6px; padding: 1px 7px; }
.cities { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.ctag { font-size: var(--fs-xs); font-weight: 700; color: var(--c); background: var(--cbg); border-radius: 6px; padding: 1px 7px; }
.hero .ctag { background: var(--card); }
.cities .to { color: var(--muted); font-size: var(--fs-xs); }
.dtitle { margin: 0; font-size: 1.2rem; line-height: 1.35; font-weight: 700; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; }
.meta span { font-size: var(--fs-xs); color: var(--ink-2); background: var(--card); border-radius: 999px; padding: 3px 10px; box-shadow: 0 0 0 1px var(--line) inset; }

/* weather */
.wxb { display: grid; justify-items: end; gap: 1px; text-align: right; min-width: 92px; }
.wxb .wi { width: 34px; height: 34px; }
.wxb .tt { font-family: var(--f-data); font-weight: 600; font-size: 1.35rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.wxb .tt small { font-size: 0.95rem; color: var(--muted); font-weight: 500; }
.wxb .ds { font-size: var(--fs-xs); color: var(--ink-2); white-space: nowrap; }
.wxb .pp { font-size: var(--fs-xs); color: var(--rain); font-weight: 600; white-space: nowrap; }
.wxb.pending { min-width: 0; max-width: 132px; }
.wxb.pending .ds { white-space: normal; color: var(--muted); line-height: 1.4; }
.wi { color: var(--ink-2); }
.wi .sun { color: var(--sun); }
.wi .drop { color: var(--rain); }
.hours { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin-inline: -4px; padding: 2px 4px; }
.hours::-webkit-scrollbar { display: none; }
.hr { flex: none; width: 46px; display: grid; justify-items: center; gap: 1px; padding: 6px 0; border-radius: 12px; background: var(--card); box-shadow: 0 0 0 1px var(--line) inset; }
.hr.now { box-shadow: 0 0 0 2px var(--ink) inset; }
.hr .h { font-size: 0.68rem; color: var(--muted); }
.hr .wi { width: 20px; height: 20px; }
.hr .t { font-family: var(--f-data); font-weight: 600; font-size: 0.95rem; font-variant-numeric: tabular-nums; }
.hr .p { font-size: 0.66rem; color: var(--rain); font-weight: 600; min-height: 1em; }
.wx-more { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: var(--fs-xs); color: var(--ink-2); }
.wx-more span { display: inline-flex; align-items: center; gap: 4px; }
.wx-more .wi { width: 16px; height: 16px; }
.wx-src { font-size: 0.68rem; color: var(--muted); }

.warn { background: var(--tight-bg); color: var(--ink); border-radius: var(--r-s); padding: 11px 13px; font-size: var(--fs-s); line-height: 1.6; box-shadow: 0 0 0 1px var(--tight-line) inset; }
.warn b { color: var(--tight); margin-right: 6px; }

/* timeline: the day as a metro line */
.tl { list-style: none; margin: 0; padding: 14px 14px 12px 0; border-radius: var(--r-l); }
.stop { display: grid; grid-template-columns: 56px 22px minmax(0, 1fr); column-gap: 6px; position: relative; padding-block: 2px 16px; }
.stop:last-child { padding-bottom: 2px; }
.stop .t { text-align: right; padding-top: 1px; font-family: var(--f-data); font-weight: 600; font-size: 1.04rem; line-height: 1.3; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.stop .t.lbl { font-family: var(--f-body); font-size: var(--fs-xs); font-weight: 700; color: var(--muted); padding-top: 3px; }
.stop > .rail { position: relative; }
.stop > .rail::before { content: ""; position: absolute; left: 50%; width: 4px; margin-left: -2px; top: 0; bottom: -2px; background: var(--c); border-radius: 2px; opacity: 0.9; }
.stop:first-child > .rail::before { top: 9px; }
.stop:last-child > .rail::before { bottom: auto; height: 9px; }
.stop > .rail::after { content: ""; position: absolute; left: 50%; top: 4px; width: 12px; height: 12px; margin-left: -8px; border-radius: 50%; background: var(--card); border: 2px solid var(--c); }
.stop.meal > .rail::after { width: 8px; height: 8px; margin-left: -6px; top: 6px; border-color: var(--meal); }
.stop.fix > .rail::after { background: var(--c); }
.stop.tight > .rail::after { background: var(--tight); border-color: var(--tight); box-shadow: 0 0 0 3px var(--tight-bg); }
.stop.fix .t { color: var(--fix); }
.stop.tight .t { color: var(--tight); }
.stop .body { min-width: 0; display: grid; gap: 4px; padding: 0 2px; border-radius: 12px; }
.stop.tight .body { background: var(--tight-bg); padding: 8px 10px; margin: -5px 0 0; }
.stop.meal .body { background: var(--meal-bg); padding: 7px 10px; margin: -4px 0 0; }
.what { font-size: var(--fs-m); font-weight: 650; line-height: 1.45; overflow-wrap: anywhere; }
.how { font-size: var(--fs-s); color: var(--ink-2); line-height: 1.62; overflow-wrap: anywhere; }
.badge { display: inline-block; font-size: 0.68rem; font-weight: 700; border-radius: 5px; padding: 0 5px; margin-left: 6px; vertical-align: 2px; line-height: 1.6; }
.badge.fix { color: var(--fix); background: var(--fix-bg); box-shadow: 0 0 0 1px var(--fix-line) inset; }
.badge.tight { color: var(--tight); background: var(--card); box-shadow: 0 0 0 1px var(--tight-line) inset; }
.badge.now { color: var(--sel-fg); background: var(--sel-bg); }
.mealtag { display: inline-block; font-size: 0.7rem; font-weight: 700; color: var(--meal); border-radius: 5px; padding: 0 5px; margin-right: 6px; vertical-align: 2px; line-height: 1.6; box-shadow: 0 0 0 1px var(--tight-line) inset; }
.mode { display: inline-block; font-size: 0.7rem; font-weight: 700; border-radius: 5px; padding: 0 5px; margin-right: 3px; line-height: 1.65; vertical-align: 1px; white-space: nowrap; color: var(--mc); background: var(--mbg); }
.mode.fly { --mc: var(--m-fly); --mbg: var(--m-fly-bg); }
.mode.rail { --mc: var(--m-rail); --mbg: var(--m-rail-bg); }
.mode.metro { --mc: var(--m-metro); --mbg: var(--m-metro-bg); }
.mode.bus { --mc: var(--m-bus); --mbg: var(--m-bus-bg); }
.mode.taxi { --mc: var(--m-taxi); --mbg: var(--m-taxi-bg); }
.mode.walk { --mc: var(--m-walk); --mbg: var(--m-walk-bg); }
.mode.bike { --mc: var(--m-bike); --mbg: var(--m-bike-bg); }
.stop.is-now .body { box-shadow: 0 0 0 2px var(--ink); }
.stop.is-now:not(.tight):not(.meal) .body { padding: 6px 8px; margin: -4px 0 0; }
@media (prefers-reduced-motion: no-preference) {
  .stop.is-now > .rail::after { animation: ping 1.8s ease-out infinite; }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 var(--c); } 70%, 100% { box-shadow: 0 0 0 8px transparent; } }
}

/* place buttons */
.places { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.pl { display: inline-flex; align-items: center; gap: 4px; min-height: 30px; box-sizing: border-box; border: 0; background: var(--chip); color: var(--chip-ink); border-radius: 999px; padding: 3px 11px 3px 8px; font-size: var(--fs-xs); font-weight: 650; line-height: 1.35; cursor: pointer; text-align: left; }
.pl svg { width: 14px; height: 14px; flex: none; }
.stop.tight .pl, .stop.meal .pl { background: var(--card); }

/* panels */
.panel { padding: 13px 15px; display: grid; gap: 7px; }
.panel h3 { margin: 0; display: flex; align-items: center; gap: 6px; font-size: var(--fs-xs); font-weight: 700; color: var(--muted); letter-spacing: 0.06em; }
.panel h3 svg { width: 15px; height: 15px; }
.panel p { margin: 0; font-size: var(--fs-s); line-height: 1.7; color: var(--ink-2); }
.panel ul { margin: 0; padding-left: 1.1em; display: grid; gap: 5px; font-size: var(--fs-s); line-height: 1.65; color: var(--ink-2); }
.panel b { color: var(--ink); }
.two { display: grid; gap: 12px; }
@media (min-width: 620px) { .two { grid-template-columns: 1fr 1fr; } }

/* hotel */
.hotel { display: grid; gap: 6px; }
.hotel .hname { font-size: var(--fs-m); font-weight: 700; line-height: 1.35; overflow-wrap: anywhere; }
.hotel .hsub { font-size: var(--fs-s); color: var(--muted); }
.hotel .addrbox { display: grid; gap: 2px; background: var(--soft); border-radius: var(--r-s); padding: 9px 11px; }
.hotel .addr { font-size: var(--fs-s); color: var(--ink); user-select: text; -webkit-user-select: text; overflow-wrap: anywhere; }
.hotel .acc { font-size: var(--fs-xs); color: var(--muted); }
.st { display: inline-block; font-size: 0.68rem; font-weight: 700; border-radius: 5px; padding: 0 5px; margin-left: 6px; vertical-align: 2px; line-height: 1.6; }
.st.ok, .chip.ok { color: var(--ok); background: var(--ok-bg); }
.st.todo, .chip.todo { color: var(--todo); background: var(--todo-bg); }
.acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 2px; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 0; background: var(--soft); color: var(--ink); border-radius: 999px; padding: 7px 13px; font-size: var(--fs-s); font-weight: 650; text-decoration: none; cursor: pointer; min-height: 36px; box-sizing: border-box; box-shadow: 0 0 0 1px var(--line) inset; }

  const SAY = { kr: "여기로 가 주세요", jp: "ここまでお願いします", cn: "请带我去这里", au: "Please take me here" };
  const INLINE = !!document.getElementById("trip-data");  // the Claude copy (data inline, no lock, no outside requests)
  const MEAL_RE = /^(早饭|午饭|晚饭|下午茶|零食)：/;

  let T = null;

  const bold = s => s.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  const fmtInline = s => bold(esc(s).replace(/\[\[(ok|todo)\|([^\]]+)\]\]/g, '<span class="chip $1">$2</span>'));
  const fmtHow = s => esc(s).replace(/\[([^\[\]]{1,6})\]/g, (m, n) => MODE[n] ? `<span class="mode ${MODE[n]}">${n}</span>` : m);
  const isoLocal = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const toDate = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const hhmm = d => `${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`;
  const todayIdx = () => T.days.findIndex(d => d.date === isoLocal());
  function phase() { const t = isoLocal(); return t < T.start ? "before" : t > T.end ? "after" : "during"; }
  const cityTags = list => list.map((c, k) => (k ? '<span class="to">→</span>' : "") + `<span class="ctag cc-${esc(c.cc)}">${esc(c.name)}</span>`).join("");

  // ---------------------------------------------------------------- weather (Open-Meteo, cached for offline)
  const WX_KEY = "trip.wx.v1";
  const locKey = w => `${(+w.lat).toFixed(3)},${(+w.lon).toFixed(3)}`;
  function wxLocs() {
    const m = new Map();
    T.days.forEach(d => (d.wx || []).forEach(w => { const k = locKey(w); if (!m.has(k)) m.set(k, w); }));
    return [...m.entries()].map(([key, w]) => ({ key, lat: w.lat, lon: w.lon }));
  }
  function loadWxCache() {
    try { const c = JSON.parse(store.get(WX_KEY) || "null"); if (c && c.data) { W.data = c.data; W.at = c.at || 0; } } catch (e) {}
  }
  async function loadWeather(force) {
    if (INLINE || W.loading || !T) return;
    if (!force && W.data && Date.now() - W.at < 45 * 6e4) return;
    const locs = wxLocs(); if (!locs.length) return;
    W.loading = true;
    try {
      const u = "https://api.open-meteo.com/v1/forecast?latitude=" + locs.map(l => l.lat).join(",") + "&longitude=" + locs.map(l => l.lon).join(",") +
        "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max" +
        "&hourly=temperature_2m,precipitation_probability,weather_code&forecast_hours=48&forecast_days=16&timezone=auto&wind_speed_unit=ms";
      const r = await fetch(u); if (!r.ok) throw new Error("HTTP " + r.status);
      let j = await r.json(); if (!Array.isArray(j)) j = [j];
      const data = {};
      locs.forEach((l, k) => { if (j[k] && j[k].daily) data[l.key] = { daily: j[k].daily, hourly: j[k].hourly || null }; });
      W.data = data; W.at = Date.now(); W.failed = false;
      store.set(WX_KEY, JSON.stringify({ at: W.at, data }));
    } catch (e) { W.failed = true; }
    finally { W.loading = false; }
    renderWeatherParts();
  }
  function wxDay(w, date) {
    const d = W.data && W.data[locKey(w)]; if (!d) return null;
    const i = d.daily.time.indexOf(date); if (i < 0) return null;
    const v = k => d.daily[k] ? d.daily[k][i] : null;
    return { code: v("weather_code"), hi: v("temperature_2m_max"), lo: v("temperature_2m_min"), pp: v("precipitation_probability_max"), wind: v("wind_speed_10m_max") };
  }
  function wxHours(w, date) {
    const d = W.data && W.data[locKey(w)]; if (!d || !d.hourly) return [];
    const out = [], nowKey = isoLocal() === date ? new Date().getHours() : -1;
    d.hourly.time.forEach((t, i) => {
      if (t.slice(0, 10) !== date) return;
      const h = +t.slice(11, 13);
      if (h >= 6 && h <= 23 && (h % 2 === 0 || h === nowKey)) out.push({ h, now: h === nowKey, code: d.hourly.weather_code[i], t: d.hourly.temperature_2m[i], pp: d.hourly.precipitation_probability[i] });
    });
    return out;
  }
  const mainWx = d => (d.wx || []).find(w => !w.note) || (d.wx || [])[0] || null;
  function wxReadyFrom(date) { const t = toDate(date); t.setDate(t.getDate() - 15); return `${t.getMonth() + 1}/${t.getDate()}`; }
  function wxBlock(d) {
    const w = mainWx(d); if (!w) return "";

    const x = wxDay(w, d.date);

    }
    const days = Math.round((toDate(d.date) - toDate(isoLocal())) / 864e5);
    if (days > 15) return `<div class="wxb pending"><span class="ds">${esc(w.n)}天气预报 ${wxReadyFrom(d.date)} 起有</span></div>`;
    if (days < 0) return "";
    return `<div class="wxb pending"><span class="ds">${W.loading ? "天气加载中…" : W.failed ? "连不上天气数据" : "天气加载中…"}</span></div>`;
  }
  function wxExtras(d) {

    const more = (d.wx || []).filter(x => x !== w).map(x => { const v = wxDay(x, d.date); if (!v) return ""; const [label, ic] = wmo(v.code); return `<span>${WI[ic]}${esc(x.n)}${x.note ? "（" + esc(x.note) + "）" : ""} ${esc(label)} ${deg(v.hi)}/${deg(v.lo)}</span>`; }).filter(Boolean).join("");
    const has = wxDay(w, d.date);
    const src = has ? `<div class="wx-src">天气来自 Open-Meteo · ${W.at ? "更新于 " + new Date(W.at).toLocaleString("zh-CN", { month: "numeric", day: "numeric", hour: "numeric", minute: "2-digit" }) : ""}${has.wind != null ? " · 最大风速 " + Math.round(has.wind) + " m/s" : ""}</div>` : "";
    return hours + (more ? `<div class="wx-more">${more}</div>` : "") + src;
  }
  function chipWx(d) {
    const w = mainWx(d); const x = w && wxDay(w, d.date); if (!x) return "";
    return WI[wmo(x.code)[1]] + deg(x.hi);
  }
  function renderWeatherParts() {
    if (!T) return;

  // ---------------------------------------------------------------- theme park live waits (ThemeParks.wiki)
  async function loadPark(key, force) {
    const pk = PARK[key]; if (!pk || INLINE) return;
    const st = P[key] || (P[key] = {});
    if (st.loading || (!force && st.at && Date.now() - st.at < 4 * 6e4)) return;
    st.loading = true; paintPark(key);
    try {
      const r = await fetch(`https://api.themeparks.wiki/v1/entity/${pk.id}/live`); if (!r.ok) throw new Error("HTTP " + r.status);
      const j = await r.json();
      const by = {}; (j.liveData || []).forEach(x => { by[x.id] = x; });
      st.items = pk.rides.map(([id, name]) => ({ name, x: by[id] || null }));
      st.at = Date.now(); st.err = "";
    } catch (e) { st.err = "连不上排队数据，检查网络后点刷新。"; }
    finally { st.loading = false; }
    paintPark(key);
  }
  function waitRow(it) {
    const x = it.x, q = (x && x.queue) || {};
    const wait = q.STANDBY && typeof q.STANDBY.waitTime === "number" ? q.STANDBY.waitTime : null;
    const paid = q.PAID_RETURN_TIME;
    let sub = "";
    if (paid) {
      const start = paid.returnStart ? hhmm(new Date(paid.returnStart)) : "";
      sub = paid.state === "AVAILABLE" ? `DPA 可买${start ? " · " + start + " 起" : ""}` : paid.state === "TEMP_FULL" ? "DPA 暂时买不到" : paid.state === "FINISHED" ? "DPA 已售完" : "";
    }
    const status = x ? x.status : "";
    if (status === "OPERATING" && wait != null) {
      const c = wait < 30 ? "var(--wait-lo)" : wait < 60 ? "var(--wait-mid)" : "var(--wait-hi)";
      return `<li style="--wc:${c}"><span class="n">${esc(it.name)}${sub ? `<small>${esc(sub)}</small>` : ""}</span><span class="bar"><i style="width:${Math.max(4, Math.min(100, wait / 1.2))}%"></i></span><span class="m">${wait}<small>分</small></span></li>`;
    }
    const word = !x ? "没有数据" : status === "DOWN" ? "暂停" : status === "REFURBISHMENT" ? "整修中" : status === "OPERATING" ? "运行中" : "关闭";
    return `<li><span class="n">${esc(it.name)}${sub ? `<small>${esc(sub)}</small>` : ""}</span><span class="bar"></span><span class="m off">${word}</span></li>`;

  function parkInner(d) {

  // ---------------------------------------------------------------- places: map links, sheet, driver card

  // ---------------------------------------------------------------- day view
  function currentRow(d) {
    const now = new Date(), mins = now.getHours() * 60 + now.getMinutes();

  }
  function stopHTML(r, now, k) {
    const timed = TIME_RE.test(r.t);

    const mm = MEAL_RE.exec(what);
    if (mm) { what = what.slice(mm[0].length); if (r.t !== mm[1]) tag = `<span class="mealtag">${mm[1]}</span>`; }
    const fix = r.flag === "fix" || r.flag === "fixtight", tight = r.flag === "tight" || r.flag === "fixtight";

    return `<li class="${cls}"><span class="t${timed ? "" : " lbl"}">${esc(r.t)}</span><span class="rail" aria-hidden="true"></span>` +

  function hotelCard(h, opts = {}) {
    const st = h.status ? `<span class="st ${h.status.includes("待") ? "todo" : "ok"}">${esc(h.status)}</span>` : "";
    const head = opts.withCity ? `<span class="ctag cc-${esc(h.cc)}">${esc(h.city)}${h.nights ? " " + esc(h.nights) : ""}</span>` : "";
    const addr = h.addr.length || h.access.length ? `<div class="addrbox">${h.addr.map(a => `<div class="addr">${esc(a)}</div>`).join("")}${h.access.length ? `<div class="acc">${h.access.map(esc).join(" · ")}</div>` : ""}</div>` : "";
    const copy = h.copy ? `<button class="btn primary" type="button" data-copy="${esc(h.copy)}">${ICON.copy}${h.addr.length ? "复制地址" : "复制名称"}</button>` : "";
    const drv = h.copy ? `<button class="btn" type="button" data-driver-text="${esc(h.copy)}" data-driver-zh="${esc(h.sub || h.name)}" data-driver-cc="${esc(h.cc)}">${ICON.taxi}给司机看</button>` : "";
    const maps = h.maps.map(m => `<a class="btn" href="${esc(m.url)}" target="_blank" rel="noopener">${ICON.map}${esc(m.label)}</a>`).join("");
    return `<div class="hotel">${head ? `<div>${head}</div>` : ""}<div class="hname">${esc(h.name)}${st}</div>${h.sub ? `<div class="hsub">${esc(h.sub)}</div>` : ""}${addr}<div class="acts">${copy}${drv}${maps}</div></div>`;
  }
  function renderDay() {
    const d = T.days[S.i], ti = todayIdx(), isToday = ti === S.i;
    const nowRow = isToday ? currentRow(d) : -1;
    const meta = d.meta.split(" · ").map(m => `<span>${esc(m)}</span>`).join("");
    const h = hotelOf(d);
    let stay = "";
    if (h && h.name) stay = `<div class="panel"><h3>${ICON.bed}今晚住</h3>${hotelCard(h)}</div>`;
    else if (h) stay = `<div class="panel"><h3>${ICON.bed}今晚</h3><p>${esc(h.city)}</p></div>`;
    const prev = T.days[S.i - 1], next = T.days[S.i + 1];
    const pg = (x, k, cls, label) => x
      ? `<button class="pg ${cls}" type="button" data-day="${k}"><span class="k">${label}</span><span class="v">${esc(x.md + " " + x.wd)} · ${esc(x.title)}</span></button>`
      : `<button class="pg ${cls}" type="button" disabled></button>`;
    $("#v-day").innerHTML = `
      <section class="hero cc-${esc(d.cc)}">
        <div class="hero-top">
          <div class="dline"><span class="ddate">${esc(d.md)}</span><span class="dwd">${esc(d.wd)}</span>${d.hol ? `<span class="hol">${esc(d.hol)}</span>` : ""}${isToday ? '<span class="badge now">今天</span>' : ""}</div>
          ${wxBlock(d)}
        </div>
        <div class="cities">${cityTags(d.cities)}</div>
        <h2 class="dtitle">${esc(d.title)}</h2>
        <div class="meta">${meta}</div>
        ${wxExtras(d)}
      </section>
      ${d.warn ? `<div class="warn" role="note"><b>时间紧</b>${esc(d.warn)}</div>` : ""}
      ${parkPanel(d)}
      <ol class="tl cc-${esc(d.cc)}">${d.rows.map((r, k) => stopHTML(r, k === nowRow, k)).join("")}</ol>
      <div class="two">
        <div class="panel"><h3>${ICON.bag}今天带</h3><p>${esc(d.bring)}</p></div>
        ${d.tips ? `<div class="panel"><h3>${ICON.bulb}提醒</h3><p>${esc(d.tips)}</p></div>` : ""}
      </div>
      ${stay}
      <div class="pager">${pg(prev, S.i - 1, "prev", "← 前一天")}${pg(next, S.i + 1, "next", "后一天 →")}</div>`;
    if (d.park && isToday) loadPark(d.park);
  }

  // ---------------------------------------------------------------- overview
  function renderOv() {
    const ti = todayIdx(), first = T.days[0], last = T.days[T.days.length - 1];
    const route = T.route.map((r, k) => (k ? '<span class="ar">→</span>' : "") +
      `<span class="rs cc-${esc(r.cc)}">${esc(r.city)}${r.nights ? `<small>${esc(r.nights)}</small>` : ""}</span>`).join("");
    const days = T.days.map((d, k) => {
      const w = mainWx(d), x = w && wxDay(w, d.date);
      const wx = x ? `<span class="wxs">${WI[wmo(x.code)[1]]}${deg(x.hi)}/${deg(x.lo)}</span>` : "";
      return `<li><button class="ovday cc-${esc(d.cc)}${k === ti ? " is-today" : ""}" type="button" data-go="${k}">
        <span class="od"><span class="n">${esc(d.md)}</span><span class="w">${esc(d.wd)}${d.hol ? " · 假日" : ""}${k === ti ? " · 今天" : ""}</span><span class="u"></span>${wx}</span>
        <span class="oc"><span class="cities">${cityTags(d.cities)}</span><span class="om">${fmtInline(d.main)}</span>${d.tip ? `<span class="ot">${fmtInline(d.tip)}</span>` : ""}</span>
      </button></li>`;
    }).join("");
    const foot = T.foot.map(b => `<div class="panel"><h3>${esc(b.h)}</h3><ul>${b.items.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`).join("");
    const hotels = T.hotels.filter(h => h.name).map(h => `<div class="panel">${hotelCard(h, { withCity: true })}</div>`).join("");
    $("#v-ov").innerHTML = `
      <div class="ovhero"><h1>${esc(T.title)}</h1><p class="num">${esc(first.md)}（${esc(first.wd)}）– ${esc(last.md)}（${esc(last.wd)}）· ${T.days.length} 天</p><p>更新于 ${esc(T.updated)}</p></div>
      <div class="route">${route}</div>
      <h2 class="sec">每一天</h2>
      <ol class="ovlist">${days}</ol>
      <h2 class="sec">交通和门票</h2>
      <div class="cards c2">${foot}</div>
      <h2 class="sec">住宿</h2>
      <div class="cards c2">${hotels}</div>`;
  }

  // ---------------------------------------------------------------- notes
  function renderNotes() {
    const lang = `<div class="panel"><h3>${ICON.globe}看不懂地图上的韩文、日文</h3><ul>
      <li><b>Naver 地图切成中文：</b>手机系统是中文时会自动显示中文；也可以在 App 的设置里把语言改成中文。店名、地址、分类大多有中文翻译。</li>
      <li><b>Google 地图</b>跟着手机语言走。日本的地名多是汉字，基本能看懂。</li>
      <li>点每个地点按钮，弹出来的框里有中文名和当地名：对照当地名找地图上的搜索结果；打车或问路就点「给司机看」。</li>
      <li>菜单、路牌看不懂，用 Papago（Naver 的翻译 App）拍照翻译。</li></ul></div>`;
    const notes = T.notes.map(n => `<div class="panel"><h3>${esc(n.h)}</h3><ul>${n.items.map(x => `<li>${bold(esc(x))}</li>`).join("")}</ul></div>`).join("");
    const modes = ["飞机", "高铁", "电车", "地铁", "公交", "打车", "步行", "骑车"].map(n => `<span class="mode ${MODE[n]}">${n}</span>`).join("");
    const legend = `<div class="panel"><h3>图例</h3><div class="legend">${modes}</div>
      <div class="legend"><span><span class="badge fix" style="margin-left:0">固定</span> 航班、车票、开门时间，不能晚</span><span><span class="badge tight" style="margin-left:0">紧</span> 时间卡得紧，旁边写了赶不上怎么办</span><span><span class="mealtag">午饭</span>第一家是首选</span></div></div>`;
    const tables = T.analysis.tables.map(t => `<h2 class="sec">${esc(t.h)}</h2><div class="cards c2">${t.rows.map(r =>
      `<div class="card"><div class="ct">${bold(esc(r[0]))}</div>${r.slice(1).map((v, k) => `<div class="cw"><span class="k">${esc(t.cols[k + 1])}</span><span>${bold(esc(v))}</span></div>`).join("")}</div>`).join("")}</div>`).join("");
    $("#v-notes").innerHTML = `${lang}${notes}${legend}${tables}${T.analysis.note ? `<div class="panel"><h3>帖子里反复出现的提醒</h3><p>${esc(T.analysis.note)}</p></div>` : ""}
      <p class="foot-note">内容和 PDF 详细版一致 · 更新于 ${esc(T.updated)}${S.extra}<br>天气：Open-Meteo · 排队：ThemeParks.wiki</p>`;
  }

  // ---------------------------------------------------------------- shopping
  function renderShop() {
    const s = T.shopping;
    const rules = `<div class="panel"><h3>先看规矩</h3><ul>${s.rules.map(x => `<li>${bold(esc(x))}</li>`).join("")}</ul></div>`;
    const groups = s.groups.map(g => `<div class="grp-h"><span class="ctag cc-${esc(g.cc)}">${esc(g.name)}</span></div>
      <div class="cards c2">${g.items.map(it => `<div class="card"><div class="ct">${bold(esc(it.what))}</div><div class="cw"><span class="k">在哪买</span><span>${bold(esc(it.where))}</span></div><div class="cn">${bold(esc(it.note))}</div></div>`).join("")}</div>`).join("");
    $("#v-shop").innerHTML = rules + groups;
  }

  // ---------------------------------------------------------------- navigation
  const VIEWS = { day: "#v-day", ov: "#v-ov", notes: "#v-notes", shop: "#v-shop" };
  function setTab(tab, keepScroll) {
    if (!VIEWS[tab]) tab = "day";
    S.tab = tab; store.set("trip.tab", tab);
    Object.keys(VIEWS).forEach(k => { $(VIEWS[k]).hidden = k !== tab; });
    $$(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab ? "true" : "false"));
    $("#strip").hidden = tab !== "day";
    renderStatus();
    if (!keepScroll) window.scrollTo(0, 0);
  }
  function goDay(i, how) {
    if (!T || i < 0 || i >= T.days.length) return;
    closeSheet();
    S.i = i; S.lastNav = Date.now();
    if (phase() !== "during") store.set("trip.day", String(i));
    renderDay(); syncStrip(how === "smooth" ? "smooth" : "auto"); renderStatus();
    window.scrollTo(0, 0);
  }
  function scrollToNow() {
    const el = $("#v-day .stop.is-now");
    if (!el) return;
    const top = el.getBoundingClientRect().top + window.scrollY - $(".top").getBoundingClientRect().bottom - 16;
    window.scrollTo(0, Math.max(0, top));
  }
  let toastTimer = 0;
  function toast(msg, ms) {
    const t = $("#toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, ms || 1800);
  }
  function copyText(text) {
    const done = () => toast("已复制：" + text);
    const fallback = () => {
      try {
        const ta = document.createElement("textarea");
        ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
        const ok = document.execCommand("copy"); ta.remove();
        ok ? done() : toast("复制不了，长按文字手动复制");
      } catch (e) { toast("复制不了，长按文字手动复制"); }
    };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
  }

  function wire() {
    document.addEventListener("click", e => {
      if (!$("#driver").hidden) { $("#driver").hidden = true; return; }
      const pl = e.target.closest("[data-pl]");
      if (pl && T) {
        const [k, j] = pl.dataset.pl.split(":").map(Number), r = T.days[S.i].rows[k];
        if (r && r.places && r.places[j]) openSheet(r.places[j], pl);
        return;
      }
      if (e.target.closest("#sheetBg, #sheetX")) { closeSheet(); return; }
      if (e.target.closest("[data-driver]") && sheetPlace) { openDriver(sheetPlace.q, sheetPlace.n, sheetPlace.c); return; }
      const dv = e.target.closest("[data-driver-text]");
      if (dv) { openDriver(dv.dataset.driverText, dv.dataset.driverZh, dv.dataset.driverCc); return; }
      const al = e.target.closest("#sheetActs a");
      if (al) {
        if (al.dataset.app) {  // keep the sheet open, so the web version is one tap away if the app is missing
          const t0 = Date.now();
          setTimeout(() => { if (!document.hidden && Date.now() - t0 < 8000) toast("没跳到 Naver 地图的话，点「Naver 网页版」", 3000); }, 3000);
        } else setTimeout(closeSheet, 300);
        return;
      }
      const pk = e.target.closest("[data-park]");
      if (pk) { loadPark(pk.dataset.park, true); return; }
      const c = e.target.closest("[data-copy]");
      if (c) { copyText(c.getAttribute("data-copy")); return; }
      const d = e.target.closest("[data-day]");
      if (d && !d.disabled) { goDay(+d.dataset.day, d.closest("#strip") ? "smooth" : ""); return; }
      const g = e.target.closest("[data-go]");
      if (g) { setTab("day", true); goDay(+g.dataset.go, "smooth"); return; }
      const t = e.target.closest(".tab");
      if (t) { setTab(t.dataset.tab); if (t.dataset.tab === "day") syncStrip("auto"); }
    });
    $("#todayBtn").addEventListener("click", () => {
      const ti = todayIdx(); if (ti < 0) return;
      setTab("day", true); goDay(ti, "smooth"); scrollToNow();
    });
    let sx = 0, sy = 0, st = 0;
    const v = $("#v-day");
    v.addEventListener("touchstart", e => { const t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; st = Date.now(); }, { passive: true });
    v.addEventListener("touchend", e => {
      if (e.target.closest(".hours")) return;
      const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
      if (Date.now() - st < 650 && Math.abs(dx) > 70 && Math.abs(dy) < 45) goDay(S.i + (dx < 0 ? 1 : -1), "smooth");
    }, { passive: true });
    document.addEventListener("keydown", e => {
      if (e.key === "Escape") { $("#driver").hidden = true; closeSheet(); return; }
      if (!$("#sheet").hidden || !$("#driver").hidden) return;
      if (S.tab !== "day" || e.altKey || e.metaKey || e.ctrlKey || /input|textarea/i.test((e.target.tagName || ""))) return;
      if (e.key === "ArrowRight") goDay(S.i + 1, "smooth");
      if (e.key === "ArrowLeft") goDay(S.i - 1, "smooth");
    });
    // keep "today", the "now" mark, weather and waits current
    setInterval(() => {
      if (!T || document.hidden) return;
      const d = T.days[S.i];
      if (S.tab === "day" && todayIdx() === S.i && $("#sheet").hidden) { const y = window.scrollY; renderDay(); window.scrollTo(0, y); }
      renderStatus(); syncStrip();
      if (d && d.park && isoLocal() === d.date) loadPark(d.park);
      loadWeather();
    }, 60000);
    document.addEventListener("visibilitychange", () => {
      if (document.hidden || !T) return;
      loadWeather();
      const ti = todayIdx();
      if (ti >= 0 && ti !== S.i && Date.now() - S.lastNav > 30 * 6e4) { setTab("day", true); goDay(ti); scrollToNow(); }
      else { renderStatus(); syncStrip(); if (S.tab === "day") { const y = window.scrollY; renderDay(); window.scrollTo(0, y); } }
    });
  }

  function start(data, extraNote) {
    T = data; S.extra = extraNote || "";
    loadWxCache();
    buildStrip();
    const ti = todayIdx(), saved = parseInt(store.get("trip.day"), 10);
    S.i = ti >= 0 ? ti : (saved >= 0 && saved < T.days.length ? saved : 0);
    renderDay(); renderOv(); renderNotes(); renderShop();
    const tab = store.get("trip.tab");
    setTab(ti >= 0 ? "day" : (VIEWS[tab] ? tab : "day"), true);
    syncStrip("auto");
    if (ti >= 0) requestAnimationFrame(scrollToNow);
    loadWeather();
  }
  function refresh(data, extraNote) {
    T = data; S.extra = extraNote || S.extra;
    if (S.i >= T.days.length) S.i = 0;
    buildStrip(); renderDay(); renderOv(); renderNotes(); renderShop(); syncStrip(); renderStatus();
  }

  window.__trip = { start, refresh, wire, isReady: () => !!T };
  wire();
  const inline = document.getElementById("trip-data");
  if (inline) start(JSON.parse(inline.textContent));
})();

</script>
<script>
(() => {
  "use strict";
  // Web copy only: the itinerary is encrypted (same key pair and password as the dashboard).
  const $ = s => document.querySelector(s);
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  // Same IndexedDB store as the dashboard, so a device that unlocked one page can open the other.
  const idb = (() => {
    const open = () => new Promise((res, rej) => { const r = indexedDB.open("dashboard", 1); r.onupgradeneeded = () => r.result.createObjectStore("keys"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
    const run = (mode, fn) => open().then(db => new Promise((res, rej) => {
      const tx = db.transaction("keys", mode), rq = fn(tx.objectStore("keys"));
      tx.oncomplete = () => { db.close(); res(rq ? rq.result : undefined); };
      tx.onerror = tx.onabort = () => { db.close(); rej(tx.error); };
    }));
    return { get: k => run("readonly", st => st.get(k)), set: (k, v) => run("readwrite", st => st.put(v, k)), del: k => run("readwrite", st => st.delete(k)) };
  })();
  async function getJSON(url) {
    let r;
    try { r = await fetch(url, { cache: "no-cache" }); } catch (e) { throw Object.assign(new Error("offline"), { net: true }); }
    if (!r.ok) throw Object.assign(new Error("HTTP " + r.status), { net: true });
    return { json: await r.json(), cached: r.headers.get("x-trip-cache") === "1" };
  }
  async function keyFromPassword(pw) {
    const kf = (await getJSON("key.enc.json")).json;
    const pwKey = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const aes = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(kf.salt), iterations: kf.iter, hash: "SHA-256" }, pwKey, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    let der;
    try { der = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(kf.iv) }, aes, b64(kf.ct)); }
    catch (e) { throw Object.assign(new Error("Wrong password"), { wrong: true }); }
    return crypto.subtle.importKey("pkcs8", der, { name: "RSA-OAEP", hash: "SHA-256" }, false, ["decrypt"]);
  }
  async function openData(priv, f) {
    const raw = await crypto.subtle.decrypt({ name: "RSA-OAEP" }, priv, b64(f.wk));
    const k = await crypto.subtle.importKey("raw", raw, { name: "AES-GCM" }, false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(f.iv) }, k, b64(f.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }

  let priv = null, lastCheck = 0;
  async function openTrip(first) {
    const res = await getJSON("data.enc.json");
    const doc = await openData(priv, res.json);
    lastCheck = Date.now();
    const at = String(res.json.at || doc.at || "").slice(0, 16).replace("T", " ");
    const extra = ` · 网页数据 ${at}${res.cached ? "（离线副本）" : ""}<br><button type="button" id="lockNow">锁定这台设备</button>`;
    if (first || !window.__trip.isReady()) window.__trip.start(doc.data, extra);
    else window.__trip.refresh(doc.data, extra);
    $("#lock").hidden = true;
  }
  function showLock(msg) {
    $("#lock").hidden = false;
    $("#lockErr").textContent = msg || "";
  }
  $("#lockForm").addEventListener("submit", async e => {
    e.preventDefault();
    const pw = $("#lockPw").value; if (!pw) { $("#lockPw").focus(); return; }
    const btn = $("#lockGo"); btn.disabled = true; btn.textContent = "解锁中…"; $("#lockErr").textContent = "";
    try {
      priv = await keyFromPassword(pw);
      if ($("#lockKeep").checked) { try { await idb.set("priv", priv); } catch (err) {} }
      await openTrip(true);
      $("#lockPw").value = ""; $("#lockPw").blur();
    } catch (err) {
      priv = null;
      $("#lockErr").textContent = err && err.wrong ? "密码不对，再试一次。" : "加载不了数据。检查网络后再试。";
    } finally { btn.disabled = false; btn.textContent = "解锁"; }
  });
  document.addEventListener("click", async e => {
    if (!e.target.closest("#lockNow")) return;
    try { await idb.del("priv"); } catch (err) {}
    location.reload();
  });
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && priv && Date.now() - lastCheck > 10 * 6e4) openTrip(false).catch(() => {});
  });

  async function boot() {
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js", { scope: "./" }).catch(() => {});
    if (!(window.crypto && crypto.subtle)) { showLock("要用 https 打开这个网页才能解锁。"); return; }
    try { priv = await idb.get("priv"); } catch (e) {}
    if (priv) {
      try { await openTrip(true); return; }
      catch (e) {
        if (e && e.net) { showLock("连不上网，加载不了数据。联网后再刷新。"); return; }
        try { await idb.del("priv"); } catch (err) {}
        priv = null;
      }
    }
    showLock();
  }
  boot();
})();

</script>
</body>
